<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Algorithms — Step by Step</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--orange:#e67e22;--dark:#2c3e50;--bg:#e8edf2;--border:#dce3ea;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);
  padding:1.2rem 1rem 6rem;display:flex;flex-direction:column;align-items:center;}
.sbs-head{max-width:980px;width:100%;text-align:center;margin-bottom:.6rem;}
.sbs-head h1{font-size:1.5rem;}
.sbs-head .sub{color:#777;font-size:.9rem;margin-top:.2rem;}
.sbs-bar{max-width:980px;width:100%;display:flex;gap:.5rem;align-items:center;justify-content:center;margin:.4rem 0 .8rem;}
.sbs-bar select{padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:#fff;color:var(--dark);}
.sbs-card{background:#fff;max-width:980px;width:100%;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.10);padding:1.1rem 1.4rem 1.4rem;border-top:5px solid var(--orange);}
.sbs-title{font-size:1.15rem;color:var(--orange);font-weight:700;}
.sbs-count{font-size:.82rem;color:#999;margin-bottom:.5rem;}
.sbs-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:1rem;align-items:start;}
@media(max-width:760px){.sbs-grid{grid-template-columns:1fr;}}
#stage{width:100%;height:auto;background:#fbfdff;border:1px solid #eef2f6;border-radius:8px;}
.sbs-panel{background:#f4f9fc;border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;font-size:.84rem;}
.prow{display:flex;gap:.4rem;padding:.18rem 0;border-bottom:1px dashed #e3eaf0;}
.prow:last-child{border-bottom:none;}
.plab{font-weight:700;color:#2a6fb3;min-width:92px;}
.pval{font-family:'Consolas','Fira Code',monospace;color:#1f4e7a;word-break:break-word;}
.sbs-cap{margin-top:.7rem;background:#fff7e0;border-left:4px solid #e0b341;border-radius:6px;padding:.55rem .8rem;font-size:.92rem;color:#6e4b0a;min-height:2.4rem;}
.sbs-ctrl{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--border);backdrop-filter:blur(4px);
  display:flex;gap:.6rem;align-items:center;justify-content:center;padding:.7rem;z-index:50;}
.sbs-ctrl button{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;}
.sbs-ctrl button.ghost{background:#fff;color:var(--dark);border:1px solid var(--border);}
.sbs-ctrl .pos{font-size:.85rem;color:#666;min-width:120px;text-align:center;}
.sbs-code{margin:.2rem 0;border:1px solid #2a6fb3;border-radius:8px;overflow:hidden;}
.sbs-code-lab{background:#2a6fb3;color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;}
.sbs-code pre{background:#eaf3fb;color:#1f4e7a;margin:0;padding:.8rem 1rem;font-family:'Consolas','Fira Code',monospace;font-size:.82rem;line-height:1.55;overflow-x:auto;white-space:pre;}
.sbs-tech{display:inline-block;background:#e8f5ec;color:#1e824c;border:1px solid #27ae60;border-radius:14px;font-size:.78rem;font-weight:600;padding:2px 12px;margin-bottom:.5rem;}
</style>
</head>
<body>
<div class="sbs-head"><h1>Graph Algorithms — Step by Step</h1><p class="sub">Press <strong>Next ▶</strong> (or →) to advance one step — like Beamer <code>\pause</code>.</p></div>
<div class="sbs-bar"><label style="font-size:.85rem;color:#555;">Algorithm:</label><select id="algoSel"></select></div>
<div class="sbs-card">
  <div class="sbs-title" id="scTitle"></div>
  <div class="sbs-count" id="scCount"></div>
  <div class="sbs-tech" id="scTech"></div>
  <div class="sbs-grid" id="grid"><svg id="stage" preserveAspectRatio="xMidYMid meet"></svg><div class="sbs-panel" id="panel"></div></div>
  <div id="codebox" class="sbs-code" style="display:none"><div class="sbs-code-lab">Python — algorithm &amp; example dict</div><pre id="codepre"></pre></div>
  <div class="sbs-cap" id="cap"></div>
</div>
<div class="sbs-ctrl">
  <button class="ghost" id="bPrevAlgo" title="Previous algorithm">⏮</button>
  <button class="ghost" id="bPrev">◀ Prev</button>
  <button id="bNext">Next ▶</button>
  <button class="ghost" id="bReset">⟲ Reset</button>
  <button class="ghost" id="bNextAlgo" title="Next algorithm">⏭</button>
  <span class="pos" id="pos"></span>
</div>
<script>
const SCENES = [{"name": "BFS", "title": "BFS — shortest hops from Ana", "W": 500, "H": 370, "directed": false, "pos": {"Ana": [250.0, 45.0], "Bilal": [371.24355652982143, 115.00000000000001], "Carla": [371.24355652982143, 255.0], "Diego": [250.0, 325.0], "Eva": [128.75644347017857, 255.0], "Farah": [128.7564434701786, 114.99999999999999]}, "edges": [["Ana", "Bilal", null], ["Ana", "Carla", null], ["Bilal", "Diego", null], ["Carla", "Diego", null], ["Carla", "Eva", null], ["Diego", "Farah", null]], "steps": [{"code": "from collections import deque\n\ndef bfs(G, s):\n    dist, parent = {s: 0}, {s: None}\n    q = deque([s])\n    while q:\n        u = q.popleft()\n        for v in G[u]:\n            if v not in dist:          # first time seen = shortest\n                dist[v] = dist[u] + 1\n                parent[v] = u\n                q.append(v)\n    return dist, parent\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"Ana\": [\"Bilal\", \"Carla\"],\n    \"Bilal\": [\"Ana\", \"Diego\"],\n    \"Carla\": [\"Ana\", \"Diego\", \"Eva\"],\n    \"Diego\": [\"Bilal\", \"Carla\", \"Farah\"],\n    \"Eva\": [\"Carla\"],\n    \"Farah\": [\"Diego\"],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> FIFO queue (deque) — explore level by level; first visit = shortest.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"Ana": "#e63946"}, "r": {"Ana": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Ana']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0}</span></div>", "cap": "Start: enqueue the source Ana with dist 0."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f"}, "r": {"Ana": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Bilal', 'Carla']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1}</span></div>", "cap": "Dequeue Ana. Discover Bilal, Carla at dist 1."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a"}, "r": {"Bilal": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Carla', 'Diego']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2}</span></div>", "cap": "Dequeue Bilal. Discover Diego at dist 2."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a"}, "r": {"Carla": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Diego', 'Eva']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2}</span></div>", "cap": "Dequeue Carla. Discover Eva at dist 2."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Diego": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Eva', 'Farah']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Diego. Discover Farah at dist 3."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Eva": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Farah']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Eva. No new neighbours."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Farah": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Farah. No new neighbours."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">[] (empty)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Queue empty — every shortest distance is final. Green = BFS tree."}], "tech": "FIFO queue (deque) — explore level by level; first visit = shortest"}, {"name": "DFS", "title": "DFS — iterative, with explicit stack", "W": 500, "H": 360, "directed": false, "pos": {"a": [250.0, 45.0], "b": [378.3926296998457, 138.2827057593821], "d": [329.3510090594839, 289.2172942406179], "e": [170.64899094051614, 289.2172942406179], "c": [121.60737030015426, 138.2827057593821]}, "edges": [["a", "b", null], ["a", "c", null], ["b", "d", null], ["c", "d", null], ["d", "e", null]], "steps": [{"code": "def dfs_iter(G, s):\n    seen, stack = set(), [s]\n    while stack:\n        u = stack.pop()                # LIFO -> go deep\n        if u not in seen:\n            seen.add(u)\n            stack.extend(v for v in G[u] if v not in seen)\n    return seen\n\ndef dfs_rec(G, u, seen=None):\n    if seen is None: seen = set()\n    seen.add(u)\n    for v in G[u]:\n        if v not in seen:\n            dfs_rec(G, v, seen)        # recursion = implicit stack\n    return seen\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"a\": [\"b\", \"c\"],\n    \"b\": [\"a\", \"d\"],\n    \"d\": [\"b\", \"c\", \"e\"],\n    \"e\": [\"d\"],\n    \"c\": [\"a\", \"d\"],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> stack / recursion (call stack) — dive deep, then backtrack.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {"a": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['a']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div>", "cap": "Start: push a onto the stack."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#e9c46a"}, "r": {"a": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'c']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a']</span></div>", "cap": "Pop a, mark visited. Push neighbours ['b', 'c']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#e9c46a"}, "r": {"c": "#e67e22"}, "e": {"a|c": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'd']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c']</span></div>", "cap": "Pop c, mark visited. Push neighbours ['d']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#e9c46a"}, "r": {"d": "#e67e22"}, "e": {"a|c": "t", "c|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'b', 'e']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c', 'd']</span></div>", "cap": "Pop d, mark visited. Push neighbours ['b', 'e']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"e": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'b']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c', 'd', 'e']</span></div>", "cap": "Pop e, mark visited. No new neighbours."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"b": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Pop b, mark visited. No new neighbours."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"b": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Pop b — already visited, skip."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">[] (empty)</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Stack empty — DFS finished. Green = DFS tree edges."}], "tech": "stack / recursion (call stack) — dive deep, then backtrack"}, {"name": "Cycle detection & connectivity", "title": "5.3 Cycle detection & connectivity tests (DFS + parent)", "W": 680, "H": 390, "directed": false, "pos": {"1": [140, 90], "2": [360, 90], "3": [250, 250], "4": [450, 310], "5": [590, 185]}, "edges": [["1", "2", null], ["1", "3", null], ["2", "3", null], ["3", "4", null], ["4", "5", null]], "steps": [{"code": "def has_cycle(G):\n    seen = set()\n    def visit(u, parent):\n        seen.add(u)\n        for v in G[u]:\n            if v not in seen:\n                if visit(v, u): return True\n            elif v != parent:          # back edge -> cycle\n                return True\n        return False\n    return any(visit(v, None) for v in G if v not in seen)\n\ndef is_connected(G, s):\n    return len(dfs_iter(G, s)) == len(G)\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3],\n    2: [1, 3],\n    3: [1, 2, 4],\n    4: [3, 5],\n    5: [4],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> DFS + parent tracking — a back edge to a non-parent = cycle.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">start</span></div>", "cap": "Run DFS from vertex 1, remembering each vertex's parent. Reaching an already-visited vertex that is NOT the parent = a back edge = a cycle."}, {"c": {"1": "#2a9d8f"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 1 (root)."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f"}, "r": {"2": "#e67e22"}, "e": {"1|2": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 2 from 1: tree edge 1–2."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|2": "t", "2|3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1, 3:2}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 3 from 2: tree edge 2–3."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|2": "t", "2|3": "t", "1|3": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1, 3:2}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">CYCLE found: back edge 3–1</span></div>", "cap": "At 3: neighbour 1 already visited and ≠ parent (2) → BACK EDGE 3–1. Cycle 1–…–3 detected!"}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f", "4": "#2a9d8f"}, "r": {"4": "#e67e22"}, "e": u))\n            elif v != parent:      # visited & not parent -> back edge\n                return True        # => a cycle exists\n    return False\n\ndef is_connected(G, s):\n    return len(dfs_iter(G, s)) == len(G)\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3],\n    2: [1, 3],\n    3: [1, 2, 4],\n    4: [3, 5],\n    5: [4],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> explicit stack of (node, parent) pairs — iterative DFS; a back edge to a non-parent = cycle.<br>Iterative cycle test — no recursion. Press <strong>Next ▶</strong> to run it."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(1,∅)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">start</span></div>", "cap": "Iterative DFS from vertex 1 using an explicit stack of (vertex, parent) pairs — the stack replaces the recursion."}, {"c": {"1": "#2a9d8f"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(2,1)', '(3,1)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Pop (1,∅), visit 1. Push [(2, 1), (3, 1)]."}, {"c": {"1": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(2,1)', '(2,3)', '(4,3)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '3']</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Pop (3,1), visit 3. Tree edge 1–3. Push [(2, 3), (4, 3)]."}, {"c": {"1": "#2a9d8f", "3": "#2 r's formula checks out: V − E + F = 4 − 5 + 3 = 2 ✓."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "t", "A|D": "t", "A|C": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">planar bound</span><span class=\"pval\">E ≤ 3V − 6</span></div><div class=\"prow\"><span class=\"plab\">K₅</span><span class=\"pval\">E=10 > 9 ⇒ non-planar</span></div>", "cap": "Consequence: a simple planar graph obeys E ≤ 3V − 6. K₅ has V=5, E=10 > 3·5−6 = 9 ⇒ K₅ is NOT planar (and neither is K₃,₃)."}], "tech": "counting V, E, F and Euler's formula V − E + F = 2"}, {"name": "Greedy colouring", "title": "Greedy colouring — smallest free colour, Welsh–Powell order", "W": 500, "H": 370, "directed": false, "pos": {"1": [250.0, 45.0], "2": [371.24355652982143, 115.00000000000001], "3": [371.24355652982143, 255.0], "4": [250.0, 325.0], "5": [128.75644347017857, 255.0], "6": [128.7564434701786, 114.99999999999999]}, "edges": [["1", "2", null], ["1", "3", null], ["1", "6", null], ["2", "3", null], ["2", "4", null], ["3", "4", null], ["4", "5", null], ["4", "6", null], ["5", "6", null]], "steps": [{"code": "def greedy_coloring(G, order=None):\n    if order is None:                  # Welsh-Powell: high degree first\n        order = sorted(G, key=lambda v: len(G[v]), reverse=True)\n    color = {}\n    for v in order:\n        used = {color[u] for u in G[v] if u in color}\n        c = 0\n        while c in used: c += 1        # smallest free colour\n        color[v] = c\n    return color\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3, 6],\n    2: [1, 3, 4],\n    3: [1, 2, 4],\n    4: [2, 3, 5, 6],\n    5: [4, 6],\n    6: [1, 4, 5],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> greedy + set of neighbour colours — pick the smallest free colour.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {  colour = 0 (blue)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a"}, "r": {"2": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <b style=\"color:#e67e22;\">[2]</b> 3 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">2</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">1 (yellow)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 4:0}</span></div>", "cap": "Vertex 2: neighbours use {0} → smallest free colour = 1 (yellow)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946"}, "r": {"3": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <b style=\"color:#e67e22;\">[3]</b> 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">3</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0, 1}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">2 (red)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 3:2, 4:0}</span></div>", "cap": "Vertex 3: neighbours use {0, 1} → smallest free colour = 2 (red)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946", "6": "#e9c46a"}, "r": {"6": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <span style=\"color:#27ae60;\" rithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(0, 'S')]</span></div>", "cap": "Start: dist[S]=0, push (0,S)."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(2, 'B'), (7, 'A')]</span></div>", "cap": "Settle S (dist 0). Relax: A:∞→7, B:∞→2."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"B": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "B|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:10, D:7}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(5, 'A'), (7, 'A'), (7, 'D'), (10, 'C')]</span></div>", "cap": "Settle B (dist 2). Relax: A:7→5, C:∞→10, D:∞→7."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"A": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(7, 'A'), (7, 'D'), (9, 'C'), (10, 'C')]</span></div>", "cap": "Settle A (dist 5). Relax: C:10→9."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#457b9d", "E": "#e9c46a"}, "r": {"D": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(9, 'C'), (10, 'C'), (10, 'E')]</span></div>", "cap": "Settle D (dist 7). Relax: E:∞→10."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(10, 'C'), (10, 'E')]</span></div>", "cap": "Settle C (dist 9). No improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {"E": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[]</span></div>", "cap": "Settle E (dist 10). No improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|S": ": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div>", "cap": "No priority queue here. dist[S]=0, the rest ∞. Each round we will SCAN every unsettled vertex and greedily pick the smallest."}, {"c": {"S": "#f4a261"}, "r": {"S": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">S (0)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → S (0). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a"}, "r": {}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['A:∞→7', 'B:∞→2']</span></div>", "cap": "Settle S. Relax its neighbours: A:∞→7, B:∞→2."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#f4a261"}, "r": {"B": "#e67e22"}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\" lass=\"plab\">relaxed</span><span class=\"pval\">['C:10→9']</span></div>", "cap": "Settle A. Relax its neighbours: C:10→9."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#f4a261"}, "r": {"D": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{C:9, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">D (7)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → D (7). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#457b9d", "E": "#e9c46a"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['E:∞→10']</span></div>", "cap": "Settle D. Relax its neighbours: E:∞→10."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#f4a261", "D": "#457b9d", "E": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{C:9, E:10}</span></div><div class=\"prow\"><span clas "><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div>", "cap": "Settle E. Relax its neighbours: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div>", "cap": "All vertices settled — identical shortest distances to the heap version, just chosen by an O(V²) scan instead of a priority queue. Green = shortest-path tree."}], "tech": "greedy linear scan (array) for the smallest tentative distance"}, {"name": "A*", "title": "A* — heuristic shortest path (f = g + h) from S to G", "W": 740, "H": 390, "directed": false, "pos": {"S": [60, 195], "A": [210, 70], "B": [210, 310], "C": [370, 190], "D": [530, 300], "E": [530, 80], "G": [660, 190]}, "edges": [["S", "A", 2], ["S", "B", 3], ["A", "C", 4], ["B", "C", 1], ["B", "D", 5], ["C", "D", 2], ["C", "E", 6], ["D", "G", 3], ["E", "G", 2]], "tech": "best-first search: priority f = g (cost so far) + h (admissible heuristic to goal)", "steps": [{"code": "import heapq\n\ndef a_star(adj, h, s, goal):\n    g = {s: 0}                      # cost of best path found to a node\n    came = {s: None}\n    open_pq = [(h[s], s)]           # priority = f = g + h\n    closed = set()\n    while open_pq:\n        f, u = heapq.heappop(open_pq)\n        if u == goal:               # goal popped = optimal (h admissible)\n            return reconstruct(came, goal)\n        if u in closed: continue\n        closed.add(u)\n        for v, w in adj[u]:\n            ng = g[u] + w           # tentative cost to v through u\n            if v not in g or ng < g[v]:\n                g[v] = ng; came[v] = u\n                heapq.heappush(open_pq, (ng + h[v], v))", "cap": "🔑 Key technique: A* = Dijkstra steered by a heuristic. Each node's priority is <b>f = g + h</b>, where g is the cost already paid and <b>h(n)</b> is an <i>admissible</i> guess of the cost still to go. Here h(S,A,B,C,D,E,G) = 8,8,5,4,2,1,0."}, {"c": {"S": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">S:f8(0+8)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">∅</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{S:0}</span></div><div class=\"prow\"><span class=\"plab\">h  (heuristic)</span><span class=\"pval\">{S:8, A:8, B:5, C:4, D:2, E:1, G:0}</span></div>", "cap": "Init: g[S]=0, f[S]=0+8=8. Push S into the open priority queue."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">B:f8(3+5), A:f10(2+8)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">{S}</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{A:2, B:3, S:0}</span></div><div class=\"prow\"><span class=\"plab\">h  (heuristic)</span><span class=\"pval\">{S:8, A:8, B:5, C:4, D:2, E:1, G:0}</span></div>", "cap": "Pop <b>S</b> (f=8=g0+h8), move it to <i>closed</i>. Relax: A: f=2+8=10 (new); B: f=3+5=8 (new)."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"B": "#e67e22"}, "e": {"A|S": "t", "B|S": "t", "B|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">C:f8(4+4), A:f10(2+8), D:f10(8+2)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">{B, S}</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{A:2, B:3, C:4, D:8, S:0}</span></div><div class=\"prow\"><span class=\"plab\">h  (heuristic)</span><span class=\"pval\">{S:8, A:8, B:5, C:4, D:2, E:1, G:0}</span></div>", "cap": "Pop <b>B</b> (f=8=g3+h5), move it to <i>closed</i>. Relax: C: f=4+4=8 (new); D: f=8+2=10 (new)."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#457b9d", "D": "#e9c46a", "E": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"A|S": "t", "B|S": "t", "B|C": "t", "C|D": "t", "C|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">D:f8(6+2), A:f10(2+8), E:f11(10+1)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">{B, C, S}</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{A:2, B:3, C:4, D:6, E:10, S:0}</span></div><div class=\"prow\"><span class=\"plab\">h  (heuristic)</span><span class=\"pval\">{S:8, A:8, B:5, C:4, D:2, E:1, G:0}</span></div>", "cap": "Pop <b>C</b> (f=8=g4+h4), move it to <i>closed</i>. Relax: D: g 8→6, f=8; E: f=10+1=11 (new)."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#e9c46a", "G": "#e9c46a"}, "r": {"D": "#e67e22"}, "e": {"A|S": "t", "B|S": "t", "B|C": "t", "C|D": "t", "C|E": "t", "D|G": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">G:f9(9+0), A:f10(2+8), E:f11(10+1)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">{B, C, D, S}</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{A:2, B:3, C:4, D:6, E:10, G:9, S:0}</span></div><div class=\"prow\"><span class=\"plab\">h  (heuristic)</span><span class=\"pval\">{S:8, A:8, B:5, C:4, D:2, E:1, G:0}</span></div>", "cap": "Pop <b>D</b> (f=8=g6+h2), move it to <i>closed</i>. Relax: G: f=9+0=9 (new)."}, {"c": {"S": "#2a9d8f", "A": "#e9c46a", "B": "#2a9d8f", "C": "#2a9d8f", "D": "#2a9d8f", "E": "#e9c46a", "G": "#2a9d8f"}, "r": {"G": "#e67e22"}, "e": {"B|S": "t", "B|C": "t", "C|D": "t", "D|G": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">open  f=g+h</span><span class=\"pval\">A:f10(2+8), E:f11(10+1)</span></div><div class=\"prow\"><span class=\"plab\">closed</span><span class=\"pval\">{B, C, D, S}</span></div><div class=\"prow\"><span class=\"plab\">g  (cost so far)</span><span class=\"pval\">{A:2, B:3, C:4, D:6, E:10, G:9, S:0}</span></div><div class=\"prow\"><span class=\"plab\">path → </span><span class=\"pval\">S–B–C–D–G  (cost 9)</span></div>", "cap": "Pop <b>G</b> with f=9 — it is the goal, so the path is <b>optimal</b>. Shortest route <b>S–B–C–D–G</b>, cost <b>9</b>. A* never expanded A or E (their f stayed ≥ 9)."}]}, {"name": "Dijkstra FAILS (negative edge)", "title": "Counter-example — Dijkstra is wrong with a negative weight", "W": 620, "H": 370, "directed": true, "pos": {"A": [80, 185], "B": [300, 75], "C": [300, 300], "D": [520, 185]}, "edges": [["A", "B", 1], ["A", "C", 5], ["B", "D", 1], ["C", "D", -4]], "steps": [{"code": "# The SAME greedy Dijkstra -- but INVALID with negative edges.\ndef dijkstra(G, s):\n    dist = {s: 0}; seen = set()\n    for _ in range(len(G)):\n        u = min((v for v in G if v not in seen),\n                key=lambda v: dist.get(v, float('inf')))\n        seen.add(u)                    # u is FINALIZED here ...\n        for v, w in G[u].items():      # ... a later negative edge\n            nd = dist[u] + w           #     can no longer fix it!\n            if nd < dist.get(v, float('inf')):\n                dist[v] = nd\n    return dist                        # wrong if any w < 0\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"A\": {\"B\": 1, \"C\": 5},\n    \"B\": {\"D\": 1},\n    \"C\": {\"D\": -4},\n    \"D\": {},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> greedy 'settle once' — invalid when an edge is negative.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"A": "#e9c46a"}, "r": {}, "e": {"C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:∞, C:∞, D:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled</span><span class=\"pval\">{A:0, B:∞, C:∞, D:∞}</span></div>", "cap": "Dijkstra assumes a vertex's distance is final once settled. The edge C→D = −4 (red) will break that assumption."}, {"c": {"A": "#f4a261", "B": "#e9c46a", "C": "#e9c46a"}, "r": {"A": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">A (0)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['B:∞→1', 'C:∞→5']</span></div>", "cap": "Settle A (0). Relax: B→1, C→5."}, {"c": {"A": "#457b9d", "B": "#f4a261", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"B": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">B (1)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['D:∞→2']</span></div>", "cap": "Pick B (1) — closest unsettled. Settle B, relax D→2."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#f4a261"}, "r": {"D": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">D (2)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div>", "cap": "Pick D (2) and SETTLE it. Dijkstra now treats dist[D]=2 as FINAL — this is the fatal assumption."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#f4a261", "D": "#457b9d"}, "r": {"C": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">C (5)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">BLOCKED</span><span class=\"pval\">['D: 5+(-4)=1 &lt; 2 but D already settled ✗']</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Pick C (5), settle it. C→D gives 5+(−4)=1 &lt; 2 — but D is already settled, so Dijkstra refuses to fix it. ✗</span>"}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#e63946"}, "r": {"D": "#e63946"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">Dijkstra says</span><span class=\"pval\">D = 2</span></div><div class=\"prow\"><span class=\"plab\">true shortest</span><span class=\"pval\">D = 1  via A→C→D = 5+(−4)</span></div><div class=\"prow\"><span class=\"plab\">why it fails</span><span class=\"pval\">greedy 'settle once' is invalid with negative edges</span></div><div class=\"prow\"><span class=\"plab\">use instead</span><span class=\"pval\">Bellman–Ford</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Dijkstra outputs dist[D] = 2, but the true shortest path A→C→D costs 1. Wrong! For negative weights, use Bellman–Ford.</span>"}], "tech": "greedy 'settle once' — invalid when an edge is negative"}, {"name": "Bellman–Ford", "title": "Bellman–Ford — relaxing edges in fixed order", "W": 500, "H": 360, "directed": true, "pos": {"S": [250.0, 45.0], "A": [378.3926296998457, 138.2827057593821], "B": [329.3510090594839, 289.2172942406179], "C": [170.64899094051614, 289.2172942406179], "D": [121.60737030015426, 138.2827057593821]}, "edges": [["S", "A", 6], ["S", "B", 7], ["A", "B", 8], ["A", "C", -4], ["A", "D", 5], ["B", "C", 9], ["B", "D", -3], ["C", "B", 2]], "steps": [{"code": "def bellman_ford(G, s):                # handles negative edges\n    dist = {v: float('inf') for v in G}\n    dist[s] = 0\n    edges = [(u, v, w) for u in G for v, w in G[u].items()]\n    for _ in range(len(G) - 1):        # |V|-1 passes\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 6, \"B\": 7},\n    \"A\": {\"B\": 8, \"C\": -4, \"D\": 5},\n    \"B\": {\"C\": 9, \"D\": -3},\n    \"C\": {\"B\": 2},\n    \"D\": {},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> edge relaxation, |V|−1 passes (dynamic programming).<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#457b9d", "A": "#cfe3ee", "B": "#cfe3ee", "C": "#cfe3ee", "D": "#cfe3ee"}, "r": {}, "e": {"A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D 6.B→C 7.B→D 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞}</span></div>", "cap": "Edges are always relaxed in this fixed order (8 edges). Red arrow A→C = −4."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#cfe3ee", "C": "#cfe3ee", "D": "#cfe3ee"}, "r "title": "Counter-example — a negative cycle has no shortest path", "W": 600, "H": 370, "directed": true, "pos": {"S": [70, 185], "A": [300, 80], "B": [520, 185], "C": [300, 300]}, "edges": [["S", "A", 4], ["A", "B", 1], ["B", "C", -3], ["C", "A", 1]], "steps": [{"code": "def bellman_ford(G, s):\n    dist = {v: float('inf') for v in G}; dist[s] = 0\n    edges = [(u, v, w) for u in G for v, w in G[u].items()]\n    for _ in range(len(G) - 1):\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n    for u, v, w in edges:              # one extra pass:\n        if dist[u] + w < dist[v]:      # still improves =>\n            raise ValueError(\"negative cycle!\")   # no shortest path\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 4},\n    \"A\": {\"B\": 1},\n    \"B\": {\"C\": -3},\n    \"C\": {\"A\": 1},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> one extra relaxation pass detects a negative cycle.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#457b9d"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞}</span></div><div class=\"prow\"><span class=\"plab\">cycle A→B→C→A</span><span class=\"pval\">1 + (−3) + 1 = −1  (negative!)</span></div>", "cap": "The cycle A→B→C→A has weight 1 + (−3) + 1 = −1 < 0 — a negative cycle (red). Each loop lowers the cost, so no shortest path exists. Watch the distances fall."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">1 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">A:∞→4, B:∞→5, C:∞→2, A:4→3</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:3, B:5, C:2}</span></div>", "cap": "Pass 1: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">2 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">B:5→4, C:2→1, A:3→2</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:2, B:4, C:1}</span></div>", "cap": "Pass 2: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">3 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">B:4→3, C:1→0, A:2→1</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:1, B:3, C:0}</span></div>", "cap": "Pass 3: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e63946", "B": "#e63946", "C": "#e63946"}, "r": {"A": "#e63946", "B": "#e63946", "C": "#e63946"}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 (extra check)</span></div><div class=\"prow\"><span class=\"plab\">still improves</span><span class=\"pval\">['A→B: 1+(1)=2 &lt; 3']</span></div><div class=\"prow\"><span class=\"plab\">verdict</span><span class=\"pval\">NEGATIVE CYCLE — no shortest path</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Extra pass |V|=4 STILL finds an improvement (A→B: 1+(1)=2 &lt; 3) ⇒ Bellman–Ford detects a negative cycle and reports that no shortest path exists.</span>"}], "tech": "one extra relaxation pass detects a negative cycle"}, {"name": "Floyd–Warshall", "title": "Floyd–Warshall — all-pairs via the adjacency matrix", "W": 520, "H": 370, "directed": true, "pos": {"A": [120, 70], "B": [400, 70], "C": [400, 300], "D": [120, 300]}, "edges": [["A", "B", 3], ["A", "C", 9], ["B", "C", 2], ["B", "D", 8], ["C", "D", 1], ["D", "A", 4]], "steps": [{"code": "def floyd_warshall(D):                 # D = adjacency matrix (inf, 0 on diag)\n    n = len(D)\n    for k in range(n):                 # allow intermediate vertex k\n        for i in range(n):\n            for j in range(n):\n                if D[i][k] + D[k][j] < D[i][j]:\n                    D[i][j] = D[i][k] + D[k][j]\n    return D\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"A\": {\"B\": 3, \"C\": 9},\n    \"B\": {\"C\": 2, \"D\": 8},\n    \"C\": {\"D\": 1},\n    \"D\": {\"A\": 4},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> dynamic programming over intermediate vertex k on the adjacency matrix.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<table style=\"border-collapse:collapse;font-family:Consolas,monospace;font-size:.8rem;margin:.1rem auto;\"><tr><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">D</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">A</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">B</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">C</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">D</th></tr><tr><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">A</th><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">0</td><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">3</t ."}, {"c": {"A": "#e63946", "B": "#e63946", "C": "#e63946", "D": "#e63946", "E": "#2a9d8f", "F": "#2a9d8f", "G": "#e9c46a", "H": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"B>A": "t", "D>C": "t", "F>E": "t", "H>G": "t", "C>A": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{A:A, B:A, C:A, D:C, E:E, F:E, G:G, H:G}</span></div><div class=\"prow\"><span class=\"plab\"># components</span><span class=\"pval\">3</span></div><div class=\"prow\"><span class=\"plab\">components</span><span class=\"pval\">{A,B,C,D}, {E,F}, {G,H}</span></div>", "cap": "union(A,C): roots A≠C → link <b>C</b> under <b>A</b>. Now 3 component(s)."}, {"c": {"A": "#e63946", "B": "#e63946", "C": "#e63946", "D": "#e63946", "E": "#2a9d8f", "F": "#2a9d8f", "G": "#2a9d8f", "H": "#2a9d8f"}, "r": {"G": "#e67e22"}, "e": {"B>A": "t", "D>C": "t", "F>E": "t", "H>G": "t", "C>A": "t", "G>E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{A:A, B:A, C:A, D:C, E:E, F:E, G:E, H:G}</span></div><div class=\"prow\"><span class=\"plab\"># components</span><span class=\"pval\">2</span></div><div class=\"prow\"><span class=\"plab\">components</span><span class=\"pval\">{A,B,C,D}, {E,F,G,H}</span></div>", "cap": "union(E,G): roots E≠G → link <b>G</b> under <b>E</b>. Now 2 component(s)."}, {"c": {"A": "#e63946", "B": "#e63946", "C": "#e63946", "D": "#e63946", "E": "#e63946", "F": "#e63946", "G": "#e63946", "H": "#e63946"}, "r": {"E": "#e67e22"}, "e": {"B>A": "t", "D>C": "t", "F>E": "t", "H>G": "t", "C>A": "t", "G>E": "t", "E>A": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{A:A, B:A, C:A, D:C, E:A, F:E, G:E, H:G}</span></div><div class=\"prow\"><span class=\"plab\"># components</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">components</span><span class=\"pval\">{A,B,C,D,E,F,G,H}</span></div>", "cap": "union(A,E): roots A≠E → link <b>E</b> under <b>A</b>. Now 1 component(s)."}, {"c": {"A": "#e63946", "B": "#e63946", "C": "#e63946", "D": "#e63946", "E": "#e63946", "F": "#e63946", "G": "#e63946", "H": "#e63946"}, "r": {"H": "#e67e22"}, "e": {"B>A": "t", "D>C": "t", "F>E": "t", "H>G": "t", "C>A": "t", "G>E": "t", "E>A": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{A:A, B:A, C:A, D:C, E:A, F:E, G:E, H:G}</span></div><div class=\"prow\"><span class=\"plab\"># components</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">components</span><span class=\"pval\">{A,B,C,D,E,F,G,H}</span></div>", "cap": "union(D,H): both already have root <b>A</b> → <span style='color:#c0395a'>skip</span> (joining would make a cycle)."}, {"c": {"A": "#e63946", "B": "#e63946", "C": "#e63946", "D": "#e63946", "E": "#e63946", "F": "#e63946", "G": "#e63946", "H": "#e63946"}, "r": {}, "e": {"B>A": "t", "D>C": "t", "F>E": "t", "H>G": "t", "C>A": "t", "G>E": "t", "E>A": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{A:A, B:A, C:A, D:C, E:A, F:E, G:E, H:G}</span></div><div class=\"prow\"><span class=\"plab\"># components</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">components</span><span class=\"pval\">{A,B,C,D,E,F,G,H}</span></div>", "cap": "All operations done — one component rooted at A. find(x) returns the representative of x's set in near-constant time."}]}, {"name": "Kruskal", "title": "Kruskal — cheapest network (Union-Find)", "W": 500, "H": 370, "directed": false, "pos": {"T1": [250.0, 45.0], "T2": [383.1479122813215, 141.73762078750735], "T3": [332.28993532094626, 298.26237921249265], "T4": [167.71006467905377, 298.26237921249265], "T5": [116.85208771867849, 141.73762078750738]}, "edges": [["T1", "T2", 4], ["T1", "T3", 3], ["T2", "T3", 1], ["T2", "T4", 2], ["T3", "T4", 4], ["T3", "T5", 5], ["T4", "T5", 7]], "steps": [{"code": "def kruskal(G):                        # G[u] = {v: w}\n    parent = {v: v for v in G}\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    mst = []\n    for w, u, v in sorted((w, u, v) for u in G\n                          for v, w in G[u].items() if u < v):\n        if find(u) != find(v):\n            parent[find(u)] = find(v)  # union -> avoids a cycle\n            mst.append((u, v, w))\n    return mst\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"T1\": {\"T2\": 4, \"T3\": 3},\n    \"T2\": {\"T1\": 4, \"T3\": 1, \"T4\": 2},\n    \"T3\": {\"T1\": 3, \"T2\": 1, \"T4\": 4, \"T5\": 5},\n    \"T4\": {\"T2\": 2, \"T3\": 4, \"T5\": 7},\n    \"T5\": {\"T3\": 5, \"T4\": 7},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> sort edges + Union-Find (disjoint-set) to avoid cycles.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"T1": "#e63946", "T2": "#2a9d8f", "T3": "#e9c46a", "T4": "#457b9d", "T5": "#f4a261"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">sorted edges</span><span class=\"pval\">['1:T2T3', '2:T2T4', '3:T1T3', '4:T1T2', '4:T3T4', '5:T3T5', '7:T4T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">[]</span></div>", "cap": "Sort all edges by weight. Node colour = Union-Find component."}, {"c": {"T1": "#e63946", "T2": "#2a9d8f", "T3": "#2a9d8f", "T4": "#e9c46a", "T5": "#457b9d"}, "r": {}, "e": {"T2|T3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T2–T3 (1)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3']</span></div>", "cap": "Edge T2–T3 (1): different components → ADD."}, {"c": {"T1": "#e63946", "T2": "#2a9d8f", "T3": "#2a9d8f", "T4": "#2a9d8f", "T5": "#e9c46a"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T2–T4 (2)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4']</span></div>", "cap": "Edge T2–T4 (2): different components → ADD."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#2a9d8f"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T1–T3 (3)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4', 'T1T3']</span></div>", "cap": "Edge T1–T3 (3): different components → ADD."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#2a9d8f"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t", "T1|T2": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T1–T2 (4)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4', 'T1T3']</span></div>", "cap": "Edge T1–T2 (4): same component → skip (cycle)."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#2a9d8f"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t", "T3|T4": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T3–T4 (4)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4', 'T1T3']</span></div>", "cap": "Edge T3–T4 (4): same component → skip (cycle)."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#e63946"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t", "T3|T5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T3–T5 (5)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4', 'T1T3', 'T3T5']</span></div>", "cap": "Edge T3–T5 (5): different components → ADD."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#e63946"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t", "T3|T5": "t", "T4|T5": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">considering</span><span class=\"pval\">T4–T5 (7)</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3', 'T2T4', 'T1T3', 'T3T5']</span></div>", "cap": "Edge T4–T5 (7): same component → skip (cycle)."}, {"c": {"T1": "#e63946", "T2": "#e63946", "T3": "#e63946", "T4": "#e63946", "T5": "#e63946"}, "r": {}, "e": {"T2|T3": "t", "T2|T4": "t", "T1|T3": "t", "T3|T5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T2T3(1)', 'T2T4(2)', 'T1T3(3)', 'T3T5(5)']</span></div><div class=\"prow\"><span class=\"plab\">total</span><span class=\"pval\">11</span></div>", "cap": "All towns in one component — minimum spanning tree complete."}], "tech": "sort edges + Union-Find (disjoint-set) to avoid cycles"}, {"name": "Prim", "title": "Prim — grow one tree from T1", "W": 500, "H": 370, "directed": false, "pos": {"T1": [250.0, 45.0], "T2": [383.1479122813215, 141.73762078750735], "T3": [332.28993532094626, 298.26237921249265], "T4": [167.71006467905377, 298.26237921249265], "T5": [116.85208771867849, 141.73762078750738]}, "edges": [["T1", "T2", 4], ["T1", "T3", 3], ["T2", "T3", 1], ["T2", "T4", 2], ["T3", "T4", 4], ["T3", "T5", 5], ["T4", "T5", 7]], "steps": [{"code": "import heapq\n\ndef prim(G, start):\n    in_tree = {start}; mst = []\n    heap = [(w, start, v) for v, w in G[start].items()]\n    heapq.heapify(heap)\n    while heap and len(in_tree) < len(G):\n        w, u, v = heapq.heappop(heap)\n        if v in in_tree: continue\n        in_tree.add(v); mst.append((u, v, w))\n        for x, wx in G[v].items():\n            if x not in in_tree:\n                heapq.heappush(heap, (wx, v, x))\n    return mst\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"T1\": {\"T2\": 4, \"T3\": 3},\n    \"T2\": {\"T1\": 4, \"T3\": 1, \"T4\": 2},\n    \"T3\": {\"T1\": 3, \"T2\": 1, \"T4\": 4, \"T5\": 5},\n    \"T4\": {\"T2\": 2, \"T3\": 4, \"T5\": 7},\n    \"T5\": {\"T3\": 5, \"T4\": 7},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> grow one tree + min-heap of the frontier edges.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"T1": "#27ae60"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['3:T1T3', '4:T1T2']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">[]</span></div>", "cap": "Seed T1. Push its incident edges to the heap."}, {"c": {"T1": "#27ae60", "T3": "#27ae60"}, "r": {}, "e": {"T1|T3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T3']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['1:T3T2', '4:T1T2', '4:T3T4', '5:T3T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3']</span></div>", "cap": "Pop (3) T1→T3: add T3 to the tree, push its new edges."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['2:T2T4', '4:T1T2', '4:T3T4', '5:T3T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3', 'T3T2']</span></div>", "cap": "Pop (1) T3→T2: add T2 to the tree, push its new edges."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60", "T4": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t", "T2|T4": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3', 'T4']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['4:T1T2', '4:T3T4', '5:T3T5', '7:T4T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3', 'T3T2', 'T2T4']</span></div>", "cap": "Pop (2) T2→T4: add T4 to the tree, push its new edges."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60", "T4": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t", "T2|T4": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3', 'T4']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['4:T3T4', '5:T3T5', '7:T4T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3', 'T3T2', 'T2T4']</span></div>", "cap": "Pop (4) T1→T2: T2 already in tree → skip."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60", "T4": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t", "T2|T4": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3', 'T4']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['5:T3T5', '7:T4T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3', 'T3T2', 'T2T4']</span></div>", "cap": "Pop (4) T3→T4: T4 already in tree → skip."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60", "T4": "#27ae60", "T5": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t", "T2|T4": "t", "T3|T5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3', 'T4', 'T5']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">['7:T4T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3', 'T3T2', 'T2T4', 'T3T5']</span></div>", "cap": "Pop (5) T3→T5: add T5 to the tree, push its new edges."}, {"c": {"T1": "#27ae60", "T3": "#27ae60", "T2": "#27ae60", "T4": "#27ae60", "T5": "#27ae60"}, "r": {}, "e": {"T1|T3": "t", "T2|T3": "t", "T2|T4": "t", "T3|T5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in tree</span><span class=\"pval\">['T1', 'T2', 'T3', 'T4', 'T5']</span></div><div class=\"prow\"><span class=\"plab\">MST</span><span class=\"pval\">['T1T3(3)', 'T3T2(1)', 'T2T4(2)', 'T3T5(5)']</span></div><div class=\"prow\"><span class=\"plab\">total</span><span class=\"pval\">11</span></div>", "cap": "All towns connected — same minimum tree as Kruskal."}], "tech": "grow one tree + min-heap of the frontier edges"}, {"name": "Ford–Fulkerson", "title": "Ford–Fulkerson — augmenting paths & residual (reverse) edges", "W": 600, "H": 340, "directed": true, "pos": {"S": [70, 170], "A": [300, 70], "B": [300, 270], "T": [530, 170]}, "edges": [["S", "A", 2], ["S", "B", 2], ["A", "B", 1], ["A", "T", 2], ["B", "T", 2]], "tech": "generic augmenting-path method on the residual graph (DFS, any path)", "steps": [{"code": "def ford_fulkerson(cap, s, t):       # generic augmenting-path method\n    flow = 0\n    while exists augmenting path P in residual graph:   # ANY path (DFS)\n        b = min residual capacity along P\n        for (u, v) in P:\n            f[u][v] += b              # forward edge\n            f[v][u] -= b              # reverse (cancellation) edge\n        flow += b\n    return flow", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> the <b>residual graph</b>. Every edge keeps a forward residual (cap−flow) and a <b>reverse</b> residual (=flow) so earlier decisions can be undone. Ford–Fulkerson augments along <i>any</i> path until none remains. (A poor DFS choice here forces a cancellation — watch the red edge.)"}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "n", "S>B": "n", "A>B": "n", "A>T": "n", "B>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:0/2, S→B:0/2, A→B:0/1, A→T:0/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">0</span></div>", "cap": "All flows 0. A DFS will grab the first augmenting path it finds."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "cur", "S>B": "n", "A>B": "cur", "A>T": "n", "B>T": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:0/2, S→B:0/2, A→B:0/1, A→T:0/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">0</span></div>", "cap": "DFS picks <b>S→A→B→T</b> (through the cross edge A→B); bottleneck = <b>1</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "n", "A>B": "t", "A>T": "n", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:1/2, S→B:0/2, A→B:1/1, A→T:0/2, B→T:1/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">1</span></div>", "cap": "Push 1 along S→A→B→T. Flow = <b>1</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "cur", "S>B": "n", "A>B": "t", "A>T": "cur", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:1/2, S→B:0/2, A→B:1/1, A→T:0/2, B→T:1/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">1</span></div>", "cap": "Next DFS path <b>S→A→T</b>; bottleneck = <b>1</b> (S→A has 1 left)."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "n", "A>B": "t", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:0/2, A→B:1/1, A→T:1/2, B→T:1/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">2</span></div>", "cap": "Push 1 along S→A→T. Flow = <b>2</b>. Now S→A is saturated."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "cur", "A>B": "t", "A>T": "t", "B>T": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:0/2, A→B:1/1, A→T:1/2, B→T:1/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">2</span></div>", "cap": "Path <b>S→B→T</b>; bottleneck = <b>1</b> (B→T has 1 left)."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "t", "A>B": "t", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:1/2, A→B:1/1, A→T:1/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">3</span></div>", "cap": "Push 1 along S→B→T. Flow = <b>3</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "cur", "A>B": "r", "A>T": "cur", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:1/2, A→B:1/1, A→T:1/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">3</span></div>", "cap": "Only path left uses the <b>reverse</b> edge: <b>S→B→A→T</b>, cancelling the A→B flow. Bottleneck = <b>1</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "t", "A>B": "n", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:2/2, A→B:0/1, A→T:2/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">4</span></div>", "cap": "Push 1: S→B +1, <b>A→B −1</b> (undone), A→T +1. Flow = <b>4</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "t", "A>B": "n", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:2/2, A→B:0/1, A→T:2/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">4</span></div>", "cap": "No augmenting path remains. <b>Max flow = 4</b>. The cancellation shows why residual reverse edges are essential to correctness."}]}, {"name": "Edmonds–Karp", "title": "Edmonds–Karp — BFS shortest augmenting paths (polynomial)", "W": 600, "H": 340, "directed": true, "pos": {"S": [70, 170], "A": [300, 70], "B": [300, 270], "T": [530, 170]}, "edges": [["S", "A", 2], ["S", "B", 2], ["A", "B", 1], ["A", "T", 2], ["B", "T", 2]], "tech": "Ford–Fulkerson with BFS; O(V·E²), independent of capacities", "steps": [{"code": "from collections import deque\ndef edmonds_karp(cap, s, t):         # Ford–Fulkerson + BFS\n    flow = 0\n    while True:\n        P = bfs_shortest_augmenting(s, t)   # fewest edges\n        if not P: break\n        b = min residual on P\n        augment(P, b); flow += b\n    return flow                       # O(V·E²), independent of capacities", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> choose the <b>shortest</b> augmenting path (fewest edges) using BFS. This caps the number of augmentations at O(V·E), giving an O(V·E²) bound that does not depend on capacities. Same network as Ford–Fulkerson — BFS avoids the cross edge."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "n", "S>B": "n", "A>B": "n", "A>T": "n", "B>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:0/2, S→B:0/2, A→B:0/1, A→T:0/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">0</span></div>", "cap": "All flows 0. BFS searches for a shortest S→T path."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "cur", "S>B": "n", "A>B": "n", "A>T": "cur", "B>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:0/2, S→B:0/2, A→B:0/1, A→T:0/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">0</span></div>", "cap": "BFS shortest path <b>S→A→T</b> (length 2); bottleneck = <b>2</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "n", "A>B": "n", "A>T": "t", "B>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:0/2, A→B:0/1, A→T:2/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">2</span></div>", "cap": "Push 2 along S→A→T. Flow = <b>2</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "cur", "A>B": "n", "A>T": "t", "B>T": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:0/2, A→B:0/1, A→T:2/2, B→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">2</span></div>", "cap": "Next shortest path <b>S→B→T</b> (length 2); bottleneck = <b>2</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "t", "A>B": "n", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:2/2, A→B:0/1, A→T:2/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">4</span></div>", "cap": "Push 2 along S→B→T. Flow = <b>4</b>."}, {"c": {"S": "#e9c46a", "T": "#457b9d"}, "r": {}, "e": {"S>A": "t", "S>B": "t", "A>B": "n", "A>T": "t", "B>T": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:2/2, S→B:2/2, A→B:0/1, A→T:2/2, B→T:2/2</span></div><div class=\"prow\"><span class=\"plab\">max-flow value</span><span class=\"pval\">4</span></div>", "cap": "No S→T path in the residual graph. <b>Max flow = 4</b> in just 2 augmentations (vs Ford–Fulkerson's 4) — and the cross edge A→B was never needed."}]}, {"name": "Dinic's algorithm", "title": "Dinic — level graph + blocking flow (two phases)", "W": 620, "H": 340, "directed": true, "pos": {"S": [60, 170], "A": [230, 80], "B": [230, 260], "C": [400, 170], "T": [560, 170]}, "edges": [["S", "A", 2], ["S", "B", 2], ["A", "T", 1], ["A", "C", 1], ["B", "C", 2], ["C", "T", 2]], "tech": "BFS level graph + DFS blocking flow; O(V²·E)", "steps": [{"code": "def dinic(cap, s, t):\n    flow = 0\n    while bfs_build_levels(s):        # level[v] = BFS distance from s\n        # blocking flow: DFS only along edges level[u]→level[u]+1\n        while p := dfs_level_path(s, t):\n            augment(p)\n        flow += (this phase)\n    return flow                       # O(V²·E)", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> alternate (1) a BFS that labels every vertex with its <b>level</b> = distance from s, then (2) a DFS <b>blocking flow</b> that only follows edges going level→level+1. Each phase strictly increases the shortest s–t distance, so ≤ V phases ⇒ O(V²·E)."}, {"c": {"S": "#e63946", "A": "#2a9d8f", "B": "#2a9d8f", "C": "#e9c46a", "T": "#e9c46a"}, "r": {}, "e": {"S>A": "n", "S>B": "n", "A>T": "n", "A>C": "n", "B>C": "n", "C>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">phase</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">levels</span><span class=\"pval\">{A:1, B:1, C:2, S:0, T:2}</span></div><div class=\"prow\"><span class=\"plab\">flow / cap</span><span class=\"pval\">S→A:0/2, S→B:0/2, A→T:0/1, A→C:0/1, B→C:0/2, C→T:0/2</span></div><div class=\"prow\"><span class=\"plab\">flow value</span><span class=\"pval\">0</span></div>", "cap": "<b>Phase 1 — BFS levels:</b> S=0; A,B=1; C,T=2. The level graph keeps only edges going up one level (so C→T, both level 2, is excluded)."}, {"c": {"S": "#e63946", "A": "#2a9d8f", "B": "#2a9d8f", "C": "#e9c46a", "T": "#e9c46a"}, "r": {}, "e": {"S>A": "t", "S>B": "n", "A>T": "t", "A>C": "n", "B>C": "n", "C>T": "n"}, "p": "<div class=\"prow\"><span class=\"plab\">phase</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">levels</span><span class=\"pval\">{A:1, B:1, C:2, S:0, T:2}</span></div><div class=\"prow\"><span class=\"plab\">fl     sc._n[v].setAttribute('stroke',(st.r&&st.r[v])||'#2c3e50');sc._n[v].setAttribute('stroke-width',(st.r&&st.r[v])?'4':'2');
    sc._t[v].setAttribute('fill',LIGHT.has(col)?'#2c3e50':'#fff');}
  for(const k in sc._e){const s=(st.e&&st.e[k])||'n',ln=sc._e[k];
    if(s==='t'){ln.setAttribute('stroke','#27ae60');ln.setAttribute('stroke-width','4.5');}
    else if(s==='cur'){ln.setAttribute('stroke','#e67e22');ln.setAttribute('stroke-width','4.5');}
    else if(s==='r'){ln.setAttribute('stroke','#c0395a');ln.setAttribute('stroke-width','3.5');}
    else{ln.setAttribute('stroke','#9aa6b2');ln.setAttribute('stroke-width','2');}}
  document.getElementById('panel').innerHTML=st.p; document.getElementById('cap').innerHTML=st.cap;
}
function render(){const [si,ti]=flat[gi],sc=SCENES[si];
  if(si!==curScene){curScene=si;buildScene(sc);document.getElementById('algoSel').value=si;}
  applyStep(sc,sc.steps[ti]);
  document.getElementById('scTitle').textContent=sc.title;document.getElementById('scTech').innerHTML='🔑 Technique: '+(sc.tech||'');
  document.getElementById('scCount').textContent=`Algorithm ${si+1} / ${SCENES.length} · step ${ti+1} / ${sc.steps.length}`;
  document.getElementById('pos').textContent=`overall ${gi+1} / ${flat.length}`;}
function next(){if(gi<flat.length-1){gi++;render();}}
function prev(){if(gi>0){gi--;render();}}
function reset(){gi=sceneStart[curScene];render();}
function gotoScene(si){gi=sceneStart[si];render();}
document.getElementById('bNext').onclick=next;document.getElementById('bPrev').onclick=prev;document.getElementById('bReset').onclick=reset;
document.getElementById('bNextAlgo').onclick=()=>gotoScene(Math.min(SCENES.length-1,curScene+1));
document.getElementById('bPrevAlgo').onclick=()=>gotoScene(Math.max(0,curScene-1));
const sel=document.getElementById('algoSel');SCENES.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;sel.appendChild(o);});sel.onchange=e=>gotoScene(+e.target.value);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}else if(e.key==='r'||e.key==='R'){reset();}});
render();
</script>
</body>
