<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Algorithms — Step by Step</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--orange:#e67e22;--dark:#2c3e50;--bg:#e8edf2;--border:#dce3ea;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);
  padding:1.2rem 1rem 6rem;display:flex;flex-direction:column;align-items:center;}
.sbs-head{max-width:980px;width:100%;text-align:center;margin-bottom:.6rem;}
.sbs-head h1{font-size:1.5rem;}
.sbs-head .sub{color:#777;font-size:.9rem;margin-top:.2rem;}
.sbs-bar{max-width:980px;width:100%;display:flex;gap:.5rem;align-items:center;justify-content:center;margin:.4rem 0 .8rem;}
.sbs-bar select{padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:#fff;color:var(--dark);}
.sbs-card{background:#fff;max-width:980px;width:100%;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.10);padding:1.1rem 1.4rem 1.4rem;border-top:5px solid var(--orange);}
.sbs-title{font-size:1.15rem;color:var(--orange);font-weight:700;}
.sbs-count{font-size:.82rem;color:#999;margin-bottom:.5rem;}
.sbs-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:1rem;align-items:start;}
@media(max-width:760px){.sbs-grid{grid-template-columns:1fr;}}
#stage{width:100%;height:auto;background:#fbfdff;border:1px solid #eef2f6;border-radius:8px;}
.sbs-panel{background:#f4f9fc;border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;font-size:.84rem;}
.prow{display:flex;gap:.4rem;padding:.18rem 0;border-bottom:1px dashed #e3eaf0;}
.prow:last-child{border-bottom:none;}
.plab{font-weight:700;color:#2a6fb3;min-width:92px;}
.pval{font-family:'Consolas','Fira Code',monospace;color:#1f4e7a;word-break:break-word;}
.sbs-cap{margin-top:.7rem;background:#fff7e0;border-left:4px solid #e0b341;border-radius:6px;padding:.55rem .8rem;font-size:.92rem;color:#6e4b0a;min-height:2.4rem;}
.sbs-ctrl{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--border);backdrop-filter:blur(4px);
  display:flex;gap:.6rem;align-items:center;justify-content:center;padding:.7rem;z-index:50;}
.sbs-ctrl button{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;}
.sbs-ctrl button.ghost{background:#fff;color:var(--dark);border:1px solid var(--border);}
.sbs-ctrl .pos{font-size:.85rem;color:#666;min-width:120px;text-align:center;}
.sbs-code{margin:.2rem 0;border:1px solid #2a6fb3;border-radius:8px;overflow:hidden;}
.sbs-code-lab{background:#2a6fb3;color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;}
.sbs-code pre{background:#eaf3fb;color:#1f4e7a;margin:0;padding:.8rem 1rem;font-family:'Consolas','Fira Code',monospace;font-size:.82rem;line-height:1.55;overflow-x:auto;white-space:pre;}
.sbs-tech{display:inline-block;background:#e8f5ec;color:#1e824c;border:1px solid #27ae60;border-radius:14px;font-size:.78rem;font-weight:600;padding:2px 12px;margin-bottom:.5rem;}
</style>
</head>
<body>
<div class="sbs-head"><h1>Graph Algorithms — Step by Step</h1><p class="sub">Press <strong>Next ▶</strong> (or →) to advance one step — like Beamer <code>\pause</code>.</p></div>
<div class="sbs-bar"><label style="font-size:.85rem;color:#555;">Algorithm:</label><select id="algoSel"></select></div>
<div class="sbs-card">
  <div class="sbs-title" id="scTitle"></div>
  <div class="sbs-count" id="scCount"></div>
  <div class="sbs-tech" id="scTech"></div>
  <div class="sbs-grid" id="grid"><svg id="stage" preserveAspectRatio="xMidYMid meet"></svg><div class="sbs-panel" id="panel"></div></div>
  <div id="codebox" class="sbs-code" style="display:none"><div class="sbs-code-lab">Python — algorithm &amp; example dict</div><pre id="codepre"></pre></div>
  <div class="sbs-cap" id="cap"></div>
</div>
<div class="sbs-ctrl">
  <button class="ghost" id="bPrevAlgo" title="Previous algorithm">⏮</button>
  <button class="ghost" id="bPrev">◀ Prev</button>
  <button id="bNext">Next ▶</button>
  <button class="ghost" id="bReset">⟲ Reset</button>
  <button class="ghost" id="bNextAlgo" title="Next algorithm">⏭</button>
  <span class="pos" id="pos"></span>
</div>
<script>
const SCENES = [{"name": "BFS", "title": "BFS — shortest hops from Ana", "W": 500, "H": 370, "directed": false, "pos": {"Ana": [250.0, 45.0], "Bilal": [371.24355652982143, 115.00000000000001], "Carla": [371.24355652982143, 255.0], "Diego": [250.0, 325.0], "Eva": [128.75644347017857, 255.0], "Farah": [128.7564434701786, 114.99999999999999]}, "edges": [["Ana", "Bilal", null], ["Ana", "Carla", null], ["Bilal", "Diego", null], ["Carla", "Diego", null], ["Carla", "Eva", null], ["Diego", "Farah", null]], "steps": [{"code": "from collections import deque\n\ndef bfs(G, s):\n    dist, parent = {s: 0}, {s: None}\n    q = deque([s])\n    while q:\n        u = q.popleft()\n        for v in G[u]:\n            if v not in dist:          # first time seen = shortest\n                dist[v] = dist[u] + 1\n                parent[v] = u\n                q.append(v)\n    return dist, parent\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"Ana\": [\"Bilal\", \"Carla\"],\n    \"Bilal\": [\"Ana\", \"Diego\"],\n    \"Carla\": [\"Ana\", \"Diego\", \"Eva\"],\n    \"Diego\": [\"Bilal\", \"Carla\", \"Farah\"],\n    \"Eva\": [\"Carla\"],\n    \"Farah\": [\"Diego\"],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> FIFO queue (deque) — explore level by level; first visit = shortest.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"Ana": "#e63946"}, "r": {"Ana": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Ana']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0}</span></div>", "cap": "Start: enqueue the source Ana with dist 0."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f"}, "r": {"Ana": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Bilal', 'Carla']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1}</span></div>", "cap": "Dequeue Ana. Discover Bilal, Carla at dist 1."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a"}, "r": {"Bilal": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Carla', 'Diego']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2}</span></div>", "cap": "Dequeue Bilal. Discover Diego at dist 2."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a"}, "r": {"Carla": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Diego', 'Eva']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2}</span></div>", "cap": "Dequeue Carla. Discover Eva at dist 2."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Diego": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Eva', 'Farah']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Diego. Discover Farah at dist 3."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Eva": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['Farah']</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Eva. No new neighbours."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {"Farah": "#e67e22"}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Dequeue Farah. No new neighbours."}, {"c": {"Ana": "#e63946", "Bilal": "#2a9d8f", "Carla": "#2a9d8f", "Diego": "#e9c46a", "Eva": "#e9c46a", "Farah": "#457b9d"}, "r": {}, "e": {"Ana|Bilal": "t", "Ana|Carla": "t", "Bilal|Diego": "t", "Carla|Eva": "t", "Diego|Farah": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">[] (empty)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{Ana:0, Bilal:1, Carla:1, Diego:2, Eva:2, Farah:3}</span></div>", "cap": "Queue empty — every shortest distance is final. Green = BFS tree."}], "tech": "FIFO queue (deque) — explore level by level; first visit = shortest"}, {"name": "DFS", "title": "DFS — iterative, with explicit stack", "W": 500, "H": 360, "directed": false, "pos": {"a": [250.0, 45.0], "b": [378.3926296998457, 138.2827057593821], "d": [329.3510090594839, 289.2172942406179], "e": [170.64899094051614, 289.2172942406179], "c": [121.60737030015426, 138.2827057593821]}, "edges": [["a", "b", null], ["a", "c", null], ["b", "d", null], ["c", "d", null], ["d", "e", null]], "steps": [{"code": "def dfs_iter(G, s):\n    seen, stack = set(), [s]\n    while stack:\n        u = stack.pop()                # LIFO -> go deep\n        if u not in seen:\n            seen.add(u)\n            stack.extend(v for v in G[u] if v not in seen)\n    return seen\n\ndef dfs_rec(G, u, seen=None):\n    if seen is None: seen = set()\n    seen.add(u)\n    for v in G[u]:\n        if v not in seen:\n            dfs_rec(G, v, seen)        # recursion = implicit stack\n    return seen\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"a\": [\"b\", \"c\"],\n    \"b\": [\"a\", \"d\"],\n    \"d\": [\"b\", \"c\", \"e\"],\n    \"e\": [\"d\"],\n    \"c\": [\"a\", \"d\"],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> stack / recursion (call stack) — dive deep, then backtrack.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {"a": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['a']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div>", "cap": "Start: push a onto the stack."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#e9c46a"}, "r": {"a": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'c']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a']</span></div>", "cap": "Pop a, mark visited. Push neighbours ['b', 'c']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#e9c46a"}, "r": {"c": "#e67e22"}, "e": {"a|c": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'd']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c']</span></div>", "cap": "Pop c, mark visited. Push neighbours ['d']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#e9c46a"}, "r": {"d": "#e67e22"}, "e": {"a|c": "t", "c|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'b', 'e']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c', 'd']</span></div>", "cap": "Pop d, mark visited. Push neighbours ['b', 'e']."}, {"c": {"a": "#2a9d8f", "b": "#e9c46a", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"e": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b', 'b']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'c', 'd', 'e']</span></div>", "cap": "Pop e, mark visited. No new neighbours."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"b": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">['b']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Pop b, mark visited. No new neighbours."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {"b": "#e67e22"}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Pop b — already visited, skip."}, {"c": {"a": "#2a9d8f", "b": "#2a9d8f", "c": "#2a9d8f", "d": "#2a9d8f", "e": "#2a9d8f"}, "r": {}, "e": {"a|c": "t", "c|d": "t", "d|e": "t", "b|d": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack</span><span class=\"pval\">[] (empty)</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['a', 'b', 'c', 'd', 'e']</span></div>", "cap": "Stack empty — DFS finished. Green = DFS tree edges."}], "tech": "stack / recursion (call stack) — dive deep, then backtrack"}, {"name": "Cycle detection & connectivity", "title": "5.3 Cycle detection & connectivity tests (DFS + parent)", "W": 680, "H": 390, "directed": false, "pos": {"1": [140, 90], "2": [360, 90], "3": [250, 250], "4": [450, 310], "5": [590, 185]}, "edges": [["1", "2", null], ["1", "3", null], ["2", "3", null], ["3", "4", null], ["4", "5", null]], "steps": [{"code": "def has_cycle(G):\n    seen = set()\n    def visit(u, parent):\n        seen.add(u)\n        for v in G[u]:\n            if v not in seen:\n                if visit(v, u): return True\n            elif v != parent:          # back edge -> cycle\n                return True\n        return False\n    return any(visit(v, None) for v in G if v not in seen)\n\ndef is_connected(G, s):\n    return len(dfs_iter(G, s)) == len(G)\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3],\n    2: [1, 3],\n    3: [1, 2, 4],\n    4: [3, 5],\n    5: [4],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> DFS + parent tracking — a back edge to a non-parent = cycle.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">start</span></div>", "cap": "Run DFS from vertex 1, remembering each vertex's parent. Reaching an already-visited vertex that is NOT the parent = a back edge = a cycle."}, {"c": {"1": "#2a9d8f"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 1 (root)."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f"}, "r": {"2": "#e67e22"}, "e": {"1|2": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 2 from 1: tree edge 1–2."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|2": "t", "2|3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1, 3:2}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Enter 3 from 2: tree edge 2–3."}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|2": "t", "2|3": "t", "1|3": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">recursion</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '2', '3']</span></div><div class=\"prow\"><span class=\"plab\">parent</span><span class=\"pval\">{1:—, 2:1, 3:2}</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">CYCLE found: back edge 3–1</span></div>", "cap": "At 3: neighbour 1 already visited and ≠ parent (2) → BACK EDGE 3–1. Cycle 1–…–3 detected!"}, {"c": {"1": "#2a9d8f", "2": "#2a9d8f", "3": "#2a9d8f", "4": "#2a9d8f"}, "r": {"4": "#e67e22"}, "e": u))\n            elif v != parent:      # visited & not parent -> back edge\n                return True        # => a cycle exists\n    return False\n\ndef is_connected(G, s):\n    return len(dfs_iter(G, s)) == len(G)\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3],\n    2: [1, 3],\n    3: [1, 2, 4],\n    4: [3, 5],\n    5: [4],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> explicit stack of (node, parent) pairs — iterative DFS; a back edge to a non-parent = cycle.<br>Iterative cycle test — no recursion. Press <strong>Next ▶</strong> to run it."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(1,∅)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">start</span></div>", "cap": "Iterative DFS from vertex 1 using an explicit stack of (vertex, parent) pairs — the stack replaces the recursion."}, {"c": {"1": "#2a9d8f"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(2,1)', '(3,1)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1']</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Pop (1,∅), visit 1. Push [(2, 1), (3, 1)]."}, {"c": {"1": "#2a9d8f", "3": "#2a9d8f"}, "r": {"3": "#e67e22"}, "e": {"1|3": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">stack (node,parent)</span><span class=\"pval\">['(2,1)', '(2,3)', '(4,3)']</span></div><div class=\"prow\"><span class=\"plab\">visited</span><span class=\"pval\">['1', '3']</span></div><div class=\"prow\"><span class=\"plab\">status</span><span class=\"pval\">searching…</span></div>", "cap": "Pop (3,1), visit 3. Tree edge 1–3. Push [(2, 3), (4, 3)]."}, {"c": {"1": "#2a9d8f", "3": "#2 [u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return order if len(order) == len(G) else None   # None => cycle\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"PL\": [\"LE\"],\n    \"LE\": [\"PR\"],\n    \"PR\": [\"RI\", \"ST\"],\n    \"RI\": [\"PT\"],\n    \"ST\": [\"OS\", \"CO\"],\n    \"CO\": [\"BI\"],\n    \"OS\": [\"RF\"],\n    \"PT\": [\"MI\"],\n    \"BI\": [],\n    \"MI\": [\"GR\"],\n    \"RF\": [\"SS\", \"GR\"],\n    \"GR\": [],\n    \"SS\": [],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> in-degree counters + FIFO queue (Kahn's algorithm).<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"PL": "#e9c46a"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">in-degree(>0)</span><span class=\"pval\">{'LE': 1, 'PR': 1, 'RI': 1, 'ST': 1, 'OS': 1, 'RF': 1, 'SS': 1, 'PT': 1, 'MI': 1, 'CO': 1, 'BI': 1, 'GR': 2}</span></div><div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['PL']</span></div><div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\">[]</span></div>", "cap": "Initial: courses with no prerequisites (in-degree 0) enter the queue."}, {"c": {"PL": "#27ae60", "LE": "#e9c46a"}, "r": {"PL": "#e67e22"}, "e": {"PL>LE": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in-degree(>0)</span><span class=\"pval\">{'PR': 1, 'RI': 1, 'ST': 1, 'OS': 1, 'RF': 1, 'SS': 1, 'PT': 1, 'MI': 1, 'CO': 1, 'BI': 1, 'GR': 2}</span></div><div class=\"prow\"><span class=\"plab\">queue</span><span class=\"pval\">['LE']</span></div><div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\">['PL']</span></div>", "cap": "Take PL (added to plan). Unlocked LE."}, {"c": {"PL": "#27ae60", "LE": "#27ae60", "PR": "#e9c46a"}, "r": {"LE": "#e67e22"}, "e": {"PL>LE": "t", "LE>PR": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">in-degree(>0)</span>< , [3, 6, null]], "steps": [{"code": "from collections import deque\n\ndef two_color(G):\n    color = {}\n    for s in G:\n        if s in color: continue\n        color[s] = 0\n        q = deque([s])\n        while q:\n            u = q.popleft()\n            for v in G[u]:\n                if v not in color:\n                    color[v] = 1 - color[u]\n                    q.append(v)\n                elif color[v] == color[u]:\n                    return None        # odd cycle -> not bipartite\n    return color\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [4, 5],\n    2: [4, 6],\n    3: [5, 6],\n    4: [1, 2],\n    5: [1, 3],\n    6: [2, 3],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> BFS + 2-colouring — alternate colours 0 / 1.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"1": "#457b9d"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">colours</span><span class=\"pval\">{1: 0}</span></div>", "cap": "Seed vertex 1 with colour 0 (Room A)."}, {"c": {"1": "#457b9d", "4": "#e9c46a", "5": "#e9c46a"}, "r": {"1": "#e67e22"}, "e": {"1|4": "t", "1|5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">colours</span><span class=\"pval\">{1: 0, 4: 1, 5: 1}</span></div>", "cap": "From 1: assign opposite colour → 4=1, 5=1."}, {"c": {"1": "#457b9d", "4": "#e9c46a", "5": "#e9c46a", "2": "#457b9d"}, "r": {"4": "#e67e22"}, "e": {"1|4": "t", "1|5": "t", "2|4": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">colours</span><span class=\"pval\">{1: 0, 4: 1, 5: 1, 2: 0}</span></div>", "cap": "From 4: assign opposite colour → 2=0."}, {"c": {"1": "#457b9d", "4": "#e9c46a", "5": "#e9c46a", "2": "#457b9d", "3": "#457b9d"}, "r": {"5": "#e67e22"}, "e": {"1|4": "t", "1|5": "t", "2|4": "t", "3|5": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">colours</span><span class=\"pval\">{1: 0, 4: 1, 5: 1, 2: 0, 3: 0}</span></di er's formula for a connected planar graph:\ndef euler_check(V, E, F):\n    return V - E + F == 2\n\n# Necessary condition for a simple planar graph (V >= 3):\ndef planar_edge_bound_ok(V, E):\n    return E <= 3 * V - 6        # K5: E=10 > 9  -> not planar\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"A\": [\"B\", \"D\", \"C\"],\n    \"B\": [\"A\", \"C\"],\n    \"C\": [\"B\", \"D\", \"A\"],\n    \"D\": [\"C\", \"A\"],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> counting V, E, F and Euler's formula V − E + F = 2.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">Euler's formula</span><span class=\"pval\">V − E + F = 2</span></div>", "cap": "A graph is planar if it can be drawn with no crossing edges. For every connected planar graph, Euler's formula links vertices, edges and faces: V − E + F = 2."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">V (vertices)</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">E</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">F</span><span class=\"pval\">—</span></div>", "cap": "Count the vertices: V = 4 (A, B, C, D)."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "t", "A|D": "t", "A|C": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">V</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">E (edges)</span><span class=\"pval\">5</span></div><div class=\"prow\"><span class=\"plab\">F</span><span class=\"pval\">—</span></div>", "cap": "Count the edges: E = 5 (4 square sides + the diagonal A–C)."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "cur", "B|C": "cur", "C|D": "t", "A|D": "t", "A|C": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">V</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">E</span><span class=\"pval\">5</span></div><div class=\"prow\"><span class=\"plab\">faces so far</span><span class=\"pval\">1 (A-B-C)</span></div>", "cap": "Faces are the regions the drawing cuts the plane into. Bounded face #1: triangle A–B–C."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "cur", "A|D": "cur", "A|C": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">V</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">E</span><span class=\"pval\">5</span></div><div class=\"prow\"><span class=\"plab\">faces so far</span><span class=\"pval\">2 (A-B-C, A-C-D)</span></div>", "cap": "Bounded face #2: triangle A–C–D."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "t", "A|D": "t", "A|C": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">V</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">E</span><span class=\"pval\">5</span></div><div class=\"prow\"><span class=\"plab\">F (faces)</span><span class=\"pval\">3 = 2 inner + 1 outer</span></div>", "cap": "Don't forget the unbounded OUTER face. So F = 3."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "t", "A|D": "t", "A|C": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">V − E + F</span><span class=\"pval\">4 − 5 + 3 = 2 ✓</span></div>", "cap": "Euler's formula checks out: V − E + F = 4 − 5 + 3 = 2 ✓."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|C": "t", "C|D": "t", "A|D": "t", "A|C": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">planar bound</span><span class=\"pval\">E ≤ 3V − 6</span></div><div class=\"prow\"><span class=\"plab\">K₅</span><span class=\"pval\">E=10 > 9 ⇒ non-planar</span></div>", "cap": "Consequence: a simple planar graph obeys E ≤ 3V − 6. K₅ has V=5, E=10 > 3·5−6 = 9 ⇒ K₅ is NOT planar (and neither is K₃,₃)."}], "tech": "counting V, E, F and Euler's formula V − E + F = 2"}, {"name": "Greedy colouring", "title": "Greedy colouring — smallest free colour, Welsh–Powell order", "W": 500, "H": 370, "directed": false, "pos": {"1": [250.0, 45.0], "2": [371.24355652982143, 115.00000000000001], "3": [371.24355652982143, 255.0], "4": [250.0, 325.0], "5": [128.75644347017857, 255.0], "6": [128.7564434701786, 114.99999999999999]}, "edges": [["1", "2", null], ["1", "3", null], ["1", "6", null], ["2", "3", null], ["2", "4", null], ["3", "4", null], ["4", "5", null], ["4", "6", null], ["5", "6", null]], "steps": [{"code": "def greedy_coloring(G, order=None):\n    if order is None:                  # Welsh-Powell: high degree first\n        order = sorted(G, key=lambda v: len(G[v]), reverse=True)\n    color = {}\n    for v in order:\n        used = {color[u] for u in G[v] if u in color}\n        c = 0\n        while c in used: c += 1        # smallest free colour\n        color[v] = c\n    return color\n\n# -- the example graph below, as a Python dict --\nG = {\n    1: [2, 3, 6],\n    2: [1, 3, 4],\n    3: [1, 2, 4],\n    4: [2, 3, 5, 6],\n    5: [4, 6],\n    6: [1, 4, 5],\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> greedy + set of neighbour colours — pick the smallest free colour.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\">4 1 2 3 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{}</span></div>", "cap": "Visit vertices in Welsh–Powell order (largest degree first): 4, 1, 2, 3, 6, 5. Each gets the smallest colour no neighbour already uses."}, {"c": {"4": "#457b9d"}, "r": {"4": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><b style=\"color:#e67e22;\">[4]</b> 1 2 3 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">4</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">0 (blue)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{4:0}</span></div>", "cap": "Vertex 4: neighbours use {} → smallest free colour = 0 (blue)."}, {"c": {"4": "#457b9d", "1": "#457b9d"}, "r": {"1": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <b style=\"color:#e67e22;\">[1]</b> 2 3 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">1</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">0 (blue)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 4:0}</span></div>", "cap": "Vertex 1: neighbours use {} → smallest free colour = 0 (blue)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a"}, "r": {"2": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <b style=\"color:#e67e22;\">[2]</b> 3 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">2</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">1 (yellow)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 4:0}</span></div>", "cap": "Vertex 2: neighbours use {0} → smallest free colour = 1 (yellow)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946"}, "r": {"3": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <b style=\"color:#e67e22;\">[3]</b> 6 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">3</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0, 1}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">2 (red)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 3:2, 4:0}</span></div>", "cap": "Vertex 3: neighbours use {0, 1} → smallest free colour = 2 (red)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946", "6": "#e9c46a"}, "r": {"6": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <span style=\"color:#27ae60;\">3</span> <b style=\"color:#e67e22;\">[6]</b> 5</span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">6</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">1 (yellow)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 3:2, 4:0, 6:1}</span></div>", "cap": "Vertex 6: neighbours use {0} → smallest free colour = 1 (yellow)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946", "6": "#e9c46a", "5": "#e63946"}, "r": {"5": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <span style=\"color:#27ae60;\">3</span> <span style=\"color:#27ae60;\">6</span> <b style=\"color:#e67e22;\">[5]</b></span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">5</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">{0, 1}</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">2 (red)</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 3:2, 4:0, 5:2, 6:1}</span></div>", "cap": "Vertex 5: neighbours use {0, 1} → smallest free colour = 2 (red)."}, {"c": {"4": "#457b9d", "1": "#457b9d", "2": "#e9c46a", "3": "#e63946", "6": "#e9c46a", "5": "#e63946"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">order</span><span class=\"pval\"><span style=\"color:#27ae60;\">4</span> <span style=\"color:#27ae60;\">1</span> <span style=\"color:#27ae60;\">2</span> <span style=\"color:#27ae60;\">3</span> <span style=\"color:#27ae60;\">6</span> <span style=\"color:#27ae60;\">5</span></span></div><div class=\"prow\"><span class=\"plab\">at vertex</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">neighbours use</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">chosen colour</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">colouring</span><span class=\"pval\">{1:0, 2:1, 3:2, 4:0, 5:2, 6:1}</span></div>", "cap": "Done — a proper colouring using 3 colours. Adjacent vertices always differ."}], "tech": "greedy + set of neighbour colours — pick the smallest free colour"}, {"name": "Dijkstra", "title": "Dijkstra — cheapest path from S", "W": 650, "H": 370, "directed": false, "pos": {"S": [60, 185], "A": [210, 75], "B": [210, 295], "C": [380, 170], "D": [450, 300], "E": [590, 195]}, "edges": [["S", "A", 7], ["S", "B", 2], ["A", "B", 3], ["A", "C", 4], ["B", "C", 8], ["B", "D", 5], ["C", "D", 2], ["C", "E", 6], ["D", "E", 3]], "steps": [{"code": "import heapq\n\ndef dijkstra(G, s):                    # weights w >= 0\n    dist = {s: 0}\n    pq = [(0, s)]\n    while pq:\n        d, u = heapq.heappop(pq)\n        if d > dist.get(u, float('inf')):\n            continue                   # stale heap entry\n        for v, w in G[u].items():\n            nd = d + w\n            if nd < dist.get(v, float('inf')):\n                dist[v] = nd\n                heapq.heappush(pq, (nd, v))\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 7, \"B\": 2},\n    \"A\": {\"S\": 7, \"B\": 3, \"C\": 4},\n    \"B\": {\"S\": 2, \"A\": 3, \"C\": 8, \"D\": 5},\n    \"C\": {\"A\": 4, \"B\": 8, \"D\": 2, \"E\": 6},\n    \"D\": {\"B\": 5, \"C\": 2, \"E\": 3},\n    \"E\": {\"C\": 6, \"D\": 3},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> min-priority queue (binary heap) — settle the nearest vertex first.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(0, 'S')]</span></div>", "cap": "Start: dist[S]=0, push (0,S)."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a"}, "r": {"S": "#e67e22"}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(2, 'B'), (7, 'A')]</span></div>", "cap": "Settle S (dist 0). Relax: A:∞→7, B:∞→2."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"B": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "B|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:10, D:7}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(5, 'A'), (7, 'A'), (7, 'D'), (10, 'C')]</span></div>", "cap": "Settle B (dist 2). Relax: A:7→5, C:∞→10, D:∞→7."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"A": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(7, 'A'), (7, 'D'), (9, 'C'), (10, 'C')]</span></div>", "cap": "Settle A (dist 5). Relax: C:10→9."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#457b9d", "E": "#e9c46a"}, "r": {"D": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(9, 'C'), (10, 'C'), (10, 'E')]</span></div>", "cap": "Settle D (dist 7). Relax: E:∞→10."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[(10, 'C'), (10, 'E')]</span></div>", "cap": "Settle C (dist 9). No improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {"E": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[]</span></div>", "cap": "Settle E (dist 10). No improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div><div class=\"prow\"><span class=\"plab\">heap</span><span class=\"pval\">[]</span></div>", "cap": "Heap empty — shortest distances final. Green = shortest-path tree."}], "tech": "min-priority queue (binary heap) — settle the nearest vertex first"}, {"name": "Dijkstra (no heap)", "title": "Dijkstra without a heap — greedy min-distance scan", "W": 650, "H": 370, "directed": false, "pos": {"S": [60, 185], "A": [210, 75], "B": [210, 295], "C": [380, 170], "D": [450, 300], "E": [590, 195]}, "edges": [["S", "A", 7], ["S", "B", 2], ["A", "B", 3], ["A", "C", 4], ["B", "C", 8], ["B", "D", 5], ["C", "D", 2], ["C", "E", 6], ["D", "E", 3]], "steps": [{"code": "def dijkstra_array(G, s):              # O(V^2): scan, no heap\n    dist = {v: float('inf') for v in G}\n    dist[s] = 0\n    seen = set()\n    for _ in range(len(G)):\n        u = min((v for v in G if v not in seen),\n                key=lambda v: dist[v])  # greedy: smallest tentative dist\n        seen.add(u)\n        for v, w in G[u].items():\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 7, \"B\": 2},\n    \"A\": {\"S\": 7, \"B\": 3, \"C\": 4},\n    \"B\": {\"S\": 2, \"A\": 3, \"C\": 8, \"D\": 5},\n    \"C\": {\"A\": 4, \"B\": 8, \"D\": 2, \"E\": 6},\n    \"D\": {\"B\": 5, \"C\": 2, \"E\": 3},\n    \"E\": {\"C\": 6, \"D\": 3},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> greedy linear scan (array) for the smallest tentative distance.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#e9c46a"}, "r": {}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div>", "cap": "No priority queue here. dist[S]=0, the rest ∞. Each round we will SCAN every unsettled vertex and greedily pick the smallest."}, {"c": {"S": "#f4a261"}, "r": {"S": "#e67e22"}, "e": {}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">S (0)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → S (0). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a"}, "r": {}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['A:∞→7', 'B:∞→2']</span></div>", "cap": "Settle S. Relax its neighbours: A:∞→7, B:∞→2."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#f4a261"}, "r": {"B": "#e67e22"}, "e": {"A|S": "t", "B|S": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:7, B:2, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{A:7, B:2, C:∞, D:∞, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">B (2)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → B (2). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "B|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:10, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['A:7→5', 'C:∞→10', 'D:∞→7']</span></div>", "cap": "Settle B. Relax its neighbours: A:7→5, C:∞→10, D:∞→7."}, {"c": {"S": "#457b9d", "A": "#f4a261", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"A": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "B|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:10, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{A:5, C:10, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">A (5)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → A (5). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#e9c46a"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['C:10→9']</span></div>", "cap": "Settle A. Relax its neighbours: C:10→9."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#f4a261"}, "r": {"D": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{C:9, D:7, E:∞}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">D (7)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → D (7). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#457b9d", "E": "#e9c46a"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['E:∞→10']</span></div>", "cap": "Settle D. Relax its neighbours: E:∞→10."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#f4a261", "D": "#457b9d", "E": "#e9c46a"}, "r": {"C": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{C:9, E:10}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">C (9)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → C (9). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#e9c46a"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div>", "cap": "Settle C. Relax its neighbours: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#f4a261"}, "r": {"E": "#e67e22"}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'S']</span></div><div class=\"prow\"><span class=\"plab\">unsettled scan</span><span class=\"pval\">{E:10}</span></div><div class=\"prow\"><span class=\"plab\">argmin →</span><span class=\"pval\">E (10)</span></div>", "cap": "Scan all unsettled vertices and greedily pick the smallest dist → E (10). (A heap would do this in O(log V); here it is an O(V) scan.)"}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div>", "cap": "Settle E. Relax its neighbours: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d", "E": "#457b9d"}, "r": {}, "e": {"A|B": "t", "B|S": "t", "A|C": "t", "B|D": "t", "D|E": "t"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:5, B:2, C:9, D:7, E:10}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D', 'E', 'S']</span></div>", "cap": "All vertices settled — identical shortest distances to the heap version, just chosen by an O(V²) scan instead of a priority queue. Green = shortest-path tree."}], "tech": "greedy linear scan (array) for the smallest tentative distance"}, {"name": "Dijkstra FAILS (negative edge)", "title": "Counter-example — Dijkstra is wrong with a negative weight", "W": 620, "H": 370, "directed": true, "pos": {"A": [80, 185], "B": [300, 75], "C": [300, 300], "D": [520, 185]}, "edges": [["A", "B", 1], ["A", "C", 5], ["B", "D", 1], ["C", "D", -4]], "steps": [{"code": "# The SAME greedy Dijkstra -- but INVALID with negative edges.\ndef dijkstra(G, s):\n    dist = {s: 0}; seen = set()\n    for _ in range(len(G)):\n        u = min((v for v in G if v not in seen),\n                key=lambda v: dist.get(v, float('inf')))\n        seen.add(u)                    # u is FINALIZED here ...\n        for v, w in G[u].items():      # ... a later negative edge\n            nd = dist[u] + w           #     can no longer fix it!\n            if nd < dist.get(v, float('inf')):\n                dist[v] = nd\n    return dist                        # wrong if any w < 0\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"A\": {\"B\": 1, \"C\": 5},\n    \"B\": {\"D\": 1},\n    \"C\": {\"D\": -4},\n    \"D\": {},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> greedy 'settle once' — invalid when an edge is negative.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"A": "#e9c46a"}, "r": {}, "e": {"C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:∞, C:∞, D:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">[]</span></div><div class=\"prow\"><span class=\"plab\">unsettled</span><span class=\"pval\">{A:0, B:∞, C:∞, D:∞}</span></div>", "cap": "Dijkstra assumes a vertex's distance is final once settled. The edge C→D = −4 (red) will break that assumption."}, {"c": {"A": "#f4a261", "B": "#e9c46a", "C": "#e9c46a"}, "r": {"A": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">A (0)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:∞}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['B:∞→1', 'C:∞→5']</span></div>", "cap": "Settle A (0). Relax: B→1, C→5."}, {"c": {"A": "#457b9d", "B": "#f4a261", "C": "#e9c46a", "D": "#e9c46a"}, "r": {"B": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">B (1)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">['D:∞→2']</span></div>", "cap": "Pick B (1) — closest unsettled. Settle B, relax D→2."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#e9c46a", "D": "#f4a261"}, "r": {"D": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">D (2)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'D']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div>", "cap": "Pick D (2) and SETTLE it. Dijkstra now treats dist[D]=2 as FINAL — this is the fatal assumption."}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#f4a261", "D": "#457b9d"}, "r": {"C": "#e67e22"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "cur"}, "p": "<div class=\"prow\"><span class=\"plab\">pick (argmin)</span><span class=\"pval\">C (5)</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{A:0, B:1, C:5, D:2}</span></div><div class=\"prow\"><span class=\"plab\">settled</span><span class=\"pval\">['A', 'B', 'C', 'D']</span></div><div class=\"prow\"><span class=\"plab\">relaxed</span><span class=\"pval\">—</span></div><div class=\"prow\"><span class=\"plab\">BLOCKED</span><span class=\"pval\">['D: 5+(-4)=1 &lt; 2 but D already settled ✗']</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Pick C (5), settle it. C→D gives 5+(−4)=1 &lt; 2 — but D is already settled, so Dijkstra refuses to fix it. ✗</span>"}, {"c": {"A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#e63946"}, "r": {"D": "#e63946"}, "e": {"A>B": "t", "A>C": "t", "B>D": "t", "C>D": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">Dijkstra says</span><span class=\"pval\">D = 2</span></div><div class=\"prow\"><span class=\"plab\">true shortest</span><span class=\"pval\">D = 1  via A→C→D = 5+(−4)</span></div><div class=\"prow\"><span class=\"plab\">why it fails</span><span class=\"pval\">greedy 'settle once' is invalid with negative edges</span></div><div class=\"prow\"><span class=\"plab\">use instead</span><span class=\"pval\">Bellman–Ford</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Dijkstra outputs dist[D] = 2, but the true shortest path A→C→D costs 1. Wrong! For negative weights, use Bellman–Ford.</span>"}], "tech": "greedy 'settle once' — invalid when an edge is negative"}, {"name": "Bellman–Ford", "title": "Bellman–Ford — relaxing edges in fixed order", "W": 500, "H": 360, "directed": true, "pos": {"S": [250.0, 45.0], "A": [378.3926296998457, 138.2827057593821], "B": [329.3510090594839, 289.2172942406179], "C": [170.64899094051614, 289.2172942406179], "D": [121.60737030015426, 138.2827057593821]}, "edges": [["S", "A", 6], ["S", "B", 7], ["A", "B", 8], ["A", "C", -4], ["A", "D", 5], ["B", "C", 9], ["B", "D", -3], ["C", "B", 2]], "steps": [{"code": "def bellman_ford(G, s):                # handles negative edges\n    dist = {v: float('inf') for v in G}\n    dist[s] = 0\n    edges = [(u, v, w) for u in G for v, w in G[u].items()]\n    for _ in range(len(G) - 1):        # |V|-1 passes\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 6, \"B\": 7},\n    \"A\": {\"B\": 8, \"C\": -4, \"D\": 5},\n    \"B\": {\"C\": 9, \"D\": -3},\n    \"C\": {\"B\": 2},\n    \"D\": {},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> edge relaxation, |V|−1 passes (dynamic programming).<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#457b9d", "A": "#cfe3ee", "B": "#cfe3ee", "C": "#cfe3ee", "D": "#cfe3ee"}, "r": {}, "e": {"A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D 6.B→C 7.B→D 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞, D:∞}</span></div>", "cap": "Edges are always relaxed in this fixed order (8 edges). Red arrow A→C = −4."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#cfe3ee", "C": "#cfe3ee", "D": "#cfe3ee"}, "r": {"A": "#e67e22"}, "e": {"S>A": "cur", "A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">1 / 4</span></div><div class=\"prow\"><span class=\"plab\">relax edge</span><span class=\"pval\">#1/8 &nbsp; S→A (w=6)</span></div><div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\"><b style= A>D": "cur", "A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 / 4</span></div><div class=\"prow\"><span class=\"plab\">relax edge</span><span class=\"pval\">#5/8 &nbsp; A→D (w=5)</span></div><div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C <b style=\"color:#e67e22;\">[5.A→D]</b> 6.B→C 7.B→D 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">test</span><span class=\"pval\">6+(5) = 11 ≮ 1 → keep</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:6, B:4, C:2, D:1}</span></div>", "cap": "Pass 4, edge #5 A→D: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {"C": "#e67e22"}, "e": {"B>C": "cur", "A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 / 4</span></div><div class=\"prow\"><span class=\"plab\">relax edge</span><span class=\"pval\">#6/8 &nbsp; B→C (w=9)</span></div><div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D <b style=\"color:#e67e22;\">[6.B→C]</b> 7.B→D 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">test</span><span class=\"pval\">4+(9) = 13 ≮ 2 → keep</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:6, B:4, C:2, D:1}</span></div>", "cap": "Pass 4, edge #6 B→C: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {"D": "#e67e22"}, "e": {"B>D": "cur", "A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 / 4</span></div><div class=\"prow\"><span class=\"plab\">relax edge</span><span class=\"pval\">#7/8 &nbsp; B→D (w=-3)</span></div><div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D 6.B→C <b style=\"color:#e67e22;\">[7.B→D]</b> 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">test</span><span class=\"pval\">4+(-3) = 1 ≮ 1 → keep</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:6, B:4, C:2, D:1}</span></div>", "cap": "Pass 4, edge #7 B→D: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {"B": "#e67e22"}, "e": {"C>B": "cur", "A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 / 4</span></div><div class=\"prow\"><span class=\"plab\">relax edge</span><span class=\"pval\">#8/8 &nbsp; C→B (w=2)</span></div><div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D 6.B→C 7.B→D <b style=\"color:#e67e22;\">[8.C→B]</b></span></div><div class=\"prow\"><span class=\"plab\">test</span><span class=\"pval\">2+(2) = 4 ≮ 4 → keep</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:6, B:4, C:2, D:1}</span></div>", "cap": "Pass 4, edge #8 C→B: no improvement."}, {"c": {"S": "#457b9d", "A": "#457b9d", "B": "#457b9d", "C": "#457b9d", "D": "#457b9d"}, "r": {}, "e": {"A>C": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">edge order</span><span class=\"pval\">1.S→A 2.S→B 3.A→B 4.A→C 5.A→D 6.B→C 7.B→D 8.C→B</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:6, B:4, C:2, D:1}</span></div>", "cap": "After |V|−1 = 4 full passes (each in the same edge order) the distances are final."}], "tech": "edge relaxation, |V|−1 passes (dynamic programming)"}, {"name": "Bellman–Ford FAILS (negative cycle)", "title": "Counter-example — a negative cycle has no shortest path", "W": 600, "H": 370, "directed": true, "pos": {"S": [70, 185], "A": [300, 80], "B": [520, 185], "C": [300, 300]}, "edges": [["S", "A", 4], ["A", "B", 1], ["B", "C", -3], ["C", "A", 1]], "steps": [{"code": "def bellman_ford(G, s):\n    dist = {v: float('inf') for v in G}; dist[s] = 0\n    edges = [(u, v, w) for u in G for v, w in G[u].items()]\n    for _ in range(len(G) - 1):\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n    for u, v, w in edges:              # one extra pass:\n        if dist[u] + w < dist[v]:      # still improves =>\n            raise ValueError(\"negative cycle!\")   # no shortest path\n    return dist\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"S\": {\"A\": 4},\n    \"A\": {\"B\": 1},\n    \"B\": {\"C\": -3},\n    \"C\": {\"A\": 1},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> one extra relaxation pass detects a negative cycle.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {"S": "#457b9d"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:∞, B:∞, C:∞}</span></div><div class=\"prow\"><span class=\"plab\">cycle A→B→C→A</span><span class=\"pval\">1 + (−3) + 1 = −1  (negative!)</span></div>", "cap": "The cycle A→B→C→A has weight 1 + (−3) + 1 = −1 < 0 — a negative cycle (red). Each loop lowers the cost, so no shortest path exists. Watch the distances fall."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">1 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">A:∞→4, B:∞→5, C:∞→2, A:4→3</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:3, B:5, C:2}</span></div>", "cap": "Pass 1: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">2 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">B:5→4, C:2→1, A:3→2</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:2, B:4, C:1}</span></div>", "cap": "Pass 2: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e9c46a", "B": "#e9c46a", "C": "#e9c46a"}, "r": {}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">3 / 3</span></div><div class=\"prow\"><span class=\"plab\">updates</span><span class=\"pval\">B:4→3, C:1→0, A:2→1</span></div><div class=\"prow\"><span class=\"plab\">dist</span><span class=\"pval\">{S:0, A:1, B:3, C:0}</span></div>", "cap": "Pass 3: relax all edges. A, B, C each drop again — the cycle keeps paying. There is no lower bound."}, {"c": {"S": "#457b9d", "A": "#e63946", "B": "#e63946", "C": "#e63946"}, "r": {"A": "#e63946", "B": "#e63946", "C": "#e63946"}, "e": {"A>B": "r", "B>C": "r", "C>A": "r"}, "p": "<div class=\"prow\"><span class=\"plab\">pass</span><span class=\"pval\">4 (extra check)</span></div><div class=\"prow\"><span class=\"plab\">still improves</span><span class=\"pval\">['A→B: 1+(1)=2 &lt; 3']</span></div><div class=\"prow\"><span class=\"plab\">verdict</span><span class=\"pval\">NEGATIVE CYCLE — no shortest path</span></div>", "cap": "<span style=\"color:#c0395a;font-weight:700;\">Extra pass |V|=4 STILL finds an improvement (A→B: 1+(1)=2 &lt; 3) ⇒ Bellman–Ford detects a negative cycle and reports that no shortest path exists.</span>"}], "tech": "one extra relaxation pass detects a negative cycle"}, {"name": "Floyd–Warshall", "title": "Floyd–Warshall — all-pairs via the adjacency matrix", "W": 520, "H": 370, "directed": true, "pos": {"A": [120, 70], "B": [400, 70], "C": [400, 300], "D": [120, 300]}, "edges": [["A", "B", 3], ["A", "C", 9], ["B", "C", 2], ["B", "D", 8], ["C", "D", 1], ["D", "A", 4]], "steps": [{"code": "def floyd_warshall(D):                 # D = adjacency matrix (inf, 0 on diag)\n    n = len(D)\n    for k in range(n):                 # allow intermediate vertex k\n        for i in range(n):\n            for j in range(n):\n                if D[i][k] + D[k][j] < D[i][j]:\n                    D[i][j] = D[i][k] + D[k][j]\n    return D\n\n# -- the example graph below, as a Python dict --\nG = {\n    \"A\": {\"B\": 3, \"C\": 9},\n    \"B\": {\"C\": 2, \"D\": 8},\n    \"C\": {\"D\": 1},\n    \"D\": {\"A\": 4},\n}", "cap": "<b style=\"color:#1e824c;\">🔑 Key technique:</b> dynamic programming over intermediate vertex k on the adjacency matrix.<br>The algorithm in Python, with the example graph as an adjacency dict. Press <strong>Next ▶</strong> to run it step by step."}, {"c": {}, "r": {}, "e": {}, "p": "<table style=\"border-collapse:collapse;font-family:Consolas,monospace;font-size:.8rem;margin:.1rem auto;\"><tr><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">D</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">A</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">B</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">C</th><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">D</th></tr><tr><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">A</th><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">0</td><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">3</td><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">9</td><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">∞</td></tr><tr><th style=\"border:1px solid #cdd6df;padding:3px 7px;background:#eef4f9;\">B</th><td style=\"border:1px solid #cdd6df;padding:3px 7px;text-align:center;\">∞</td><td style=\"border:1 function ekey(sc,u,v){return sc.directed?(u+'>'+v):[String(u),String(v)].sort().join('|');}
function buildScene(sc){
  stage.setAttribute('viewBox',`0 0 ${sc.W} ${sc.H}`); stage.innerHTML='';
  if(sc.directed){const d=document.createElementNS(NS,'defs');
    d.innerHTML='<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#7a8794"/></marker>';stage.appendChild(d);}
  sc._e={};
  sc.edges.forEach(([u,v,w])=>{const [x1,y1]=sc.pos[u],[x2,y2]=sc.pos[v];
    const ln=document.createElementNS(NS,'line');let X=x2,Y=y2;
    if(sc.directed){const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;X=x2-dx/d*20;Y=y2-dy/d*20;ln.setAttribute('marker-end','url(#ar)');}
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',X);ln.setAttribute('y2',Y);
    ln.setAttribute('stroke','#9aa6b2');ln.setAttribute('stroke-width','2');stage.appendChild(ln);sc._e[ekey(sc,u,v)]=ln;
    if(w!==null&&w!==undefined){const mx=(x1+x2)/2,my=(y1+y2)/2;
      const r=document.createElementNS(NS,'rect');r.setAttribute('x',mx-10);r.setAttribute('y',my-9);r.setAttribute('width',20);r.setAttribute('height',15);r.setAttribute('rx',3);r.setAttribute('fill','#fff');r.setAttribute('opacity','.9');r.setAttribute('stroke','#dce3ea');stage.appendChild(r);
      const t=document.createElementNS(NS,'text');t.setAttribute('x',mx);t.setAttribute('y',my+2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.setAttribute('fill','#444');t.textContent=w;stage.appendChild(t);}});
  sc._n={};sc._t={};
  for(const v in sc.pos){const [x,y]=sc.pos[v];
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',20);c.setAttribute('fill',DEFAULT);c.setAttribute('stroke','#2c3e50');c.setAttribute('stroke-width','2');stage.appendChild(c);sc._n[v]=c;
    const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.setAttribute('font-weight','700');t.textContent=v;stage.appendChild(t);sc._t[v]=t;}
}
function applyStep(sc,st){const grid=document.getElementById('grid'),cb=document.getElementById('codebox');if(st.code){grid.style.display='none';cb.style.display='block';document.getElementById('codepre').textContent=st.code;document.getElementById('cap').innerHTML=st.cap||'';return;}grid.style.display='';cb.style.display='none';
  for(const v in sc._n){const col=(st.c&&st.c[v])||DEFAULT;sc._n[v].setAttribute('fill',col);
    sc._n[v].setAttribute('stroke',(st.r&&st.r[v])||'#2c3e50');sc._n[v].setAttribute('stroke-width',(st.r&&st.r[v])?'4':'2');
    sc._t[v].setAttribute('fill',LIGHT.has(col)?'#2c3e50':'#fff');}
  for(const k in sc._e){const s=(st.e&&st.e[k])||'n',ln=sc._e[k];
    if(s==='t'){ln.setAttribute('stroke','#27ae60');ln.setAttribute('stroke-width','4.5');}
    else if(s==='cur'){ln.setAttribute('stroke','#e67e22');ln.setAttribute('stroke-width','4.5');}
    else if(s==='r'){ln.setAttribute('stroke','#c0395a');ln.setAttribute('stroke-width','3.5');}
    else{ln.setAttribute('stroke','#9aa6b2');ln.setAttribute('stroke-width','2');}}
  document.getElementById('panel').innerHTML=st.p; document.getElementById('cap').innerHTML=st.cap;
}
function render(){const [si,ti]=flat[gi],sc=SCENES[si];
  if(si!==curScene){curScene=si;buildScene(sc);document.getElementById('algoSel').value=si;}
  applyStep(sc,sc.steps[ti]);
  document.getElementById('scTitle').textContent=sc.title;document.getElementById('scTech').innerHTML='🔑 Technique: '+(sc.tech||'');
  document.getElementById('scCount').textContent=`Algorithm ${si+1} / ${SCENES.length} · step ${ti+1} / ${sc.steps.length}`;
  document.getElementById('pos').textContent=`overall ${gi+1} / ${flat.length}`;}
function next(){if(gi<flat.length-1){gi++;render();}}
function prev(){if(gi>0){gi--;render();}}
function reset(){gi=sceneStart[curScene];render();}
function gotoScene(si){gi=sceneStart[si];render();}
document.getElementById('bNext').onclick=next;document.getElementById('bPrev').onclick=prev;document.getElementById('bReset').onclick=reset;
document.getElementById('bNextAlgo').onclick=()=>gotoScene(Math.min(SCENES.length-1,curScene+1));
document.getElementById('bPrevAlgo').onclick=()=>gotoScene(Math.max(0,curScene-1));
const sel=document.getElementById('algoSel');SCENES.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;sel.appendChild(o);});sel.onchange=e=>gotoScene(+e.target.value);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}else if(e.key==='r'||e.key==='R'){reset();}});
render();
</script>
</body>
</html>
