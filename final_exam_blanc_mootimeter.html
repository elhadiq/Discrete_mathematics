<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--orange:#e67e22;--darkblue:#2c3e50;--lightbg:#f4f9fc;--border:#dce3ea;

background:var(--darkblue);padding:.25em .8em;border-radius:5px;}
.cat.IND{background:#8e44ad;}.cat.CNT{background:#16809a;}.cat.GRP{background:#2a6fb3;}

.progress{flex:1;height:9px;background:#fff;border:1px solid var(--border);border-radius:6px;overflow:hidden;}

<script>
const DATA = [{"code": "FB-IND-01", "cat": "Induction and Recursion", "qtext": "<p>For every integer <em>n</em> &ge; 1, the sum 1 + 2 + 3 + &hellip; + <em>n</em> equals:</p>", "title": "Gauss sum", "opts": [{"t": "(n+1)/2", "c": false}, {"t": "n(n+1)", "c": false}, {"t": "n<sup>2</sup>", "c": false}, {"t": "n(n+1)/2", "c": true}]}, {"code": "FB-IND-06", "cat": "Induction and Recursion", "qtext": "<p>In the recursive definition <em>n</em>! = <em>n</em> &middot; (<em>n</em>&minus;1)!, what is the correct base case?</p>", "title": "Recursive definition of factorial", "opts": [{"t": "0! = 1", "c": true}, {"t": "1! = 0", "c": false}, {"t": "0! = undefined", "c": false}, {"t": "0! = 0", "c": false}]}, {"code": "FB-IND-08", "cat": "Induction and Recursion", "qtext": "<p>For <em>n</em> &ge; 1, the sum 1<sup>2</sup> + 2<sup>2</sup> + &hellip; + <em>n</em><sup>2</sup> equals:</p>", "title": "Sum of squares formula", "opts": [{"t": "( n(n+1)/2 )<sup>2</sup>", "c": false}, {"t": "n<sup>2</sup>(n+1)", "c": false}, {"t": "n(n+1)(2n+1)/6", "c": true}, {"t": "n(n+1)/2", "c": false}]}, {"code": "FB-IND-13", "cat": "Induction and Recursion", "qtext": "<p>To prove <em>P</em>(<em>n</em>) for all <em>n</em> &ge; 1 by induction, the base case to verify is:</p>", "title": "Base case", "opts": [{"t": "P(k+1)", "c": false}, {"t": "P(0)", "c": false}, {"t": "P(k)", "c": false}, {"t": "P(1)", "c": true}]}, {"code": "FB-IND-17", "cat": "Induction and Recursion", "qtext": "<p>For <em>n</em> &ge; 1, 2 + 4 + 6 + &hellip; + 2<em>n</em> equals:</p>", "title": "Sum of even numbers", "opts": [{"t": "n(n+1)/2", "c": false}, {"t": "2n", "c": false}, {"t": "n<sup>2</sup>", "c": false}, {"t": "n(n+1)", "c": true}]}, {"code": "FB-IND-21", "cat": "Induction and Recursion", "qtext": "<p>For <em>n</em> &ge; 1, 1<sup>3</sup> + 2<sup>3</sup> + &hellip; + <em>n</em><sup>3</sup> equals:</p>", "title": "Sum of cubes", "opts": [{"t": "( n(n+1)/2 )<sup>2</sup>", "c": true}, {"t": "n<sup>4</sup>", "c": false}, {"t": "n(n+1)/2", "c": false}, {"t": "n(n+1)(2n+1)/6", "c": false}]}, {"code": "FB-IND-02", "cat": "Induction and Recursion", "qtext": "<p>A sequence is defined by <em>a</em><sub>1</sub> = 3 and <em>a</em><sub>n</sub> = 2 <em>a</em><sub>n&minus;1</sub> + 1 for <em>n</em> &ge; 2.</p>\n      <p>Compute <em>a</em><sub>4</sub>.</p>", "title": "Linear recurrence", "opts": [{"t": "31", "c": true}, {"t": "15", "c": false}, {"t": "23", "c": false}, {"t": "63", "c": false}]}, {"code": "FB-IND-05", "cat": "Induction and Recursion", "qtext": "<p>Compute the sum 2 + 4 + 6 + &hellip; + 20.</p>", "title": "Sum of even numbers", "opts": [{"t": "100", "c": false}, {"t": "110", "c": true}, {"t": "90", "c": false}, {"t": "210", "c": false}]}, {"code": "FB-IND-07", "cat": "Induction and Recursion", "qtext": "<p>Compute 1 + 2 + 3 + &hellip; + 100.</p>", "title": "Gauss sum to 100", "opts": [{"t": "5050", "c": true}, {"t": "2550", "c": false}, {"t": "10100", "c": false}, {"t": "5000", "c": false}]}, {"code": "FB-IND-09", "cat": "Induction and Recursion", "qtext": "<p>Let <em>a</em><sub>1</sub> = 5 and <em>a</em><sub>n</sub> = <em>a</em><sub>n&minus;1</sub> + 4. Find <em>a</em><sub>6</sub>.</p>", "title": "Arithmetic term", "opts": [{"t": "29", "c": false}, {"t": "24", "c": false}, {"t": "25", "c": true}, {"t": "21", "c": false}]}, {"code": "FB-IND-11", "cat": "Induction and Recursion", "qtext": "<p>Let <em>a</em><sub>0</sub> = 1 and <em>a</em><sub>n</sub> = 3 <em>a</em><sub>n&minus;1</sub>. Find <em>a</em><sub>4</sub>.</p>", "title": "Geometric term", "opts": [{"t": "27", "c": false}, {"t": "64", "c": false}, {"t": "81", "c": true}, {"t": "243", "c": false}]}, {"code": "FB-IND-14", "cat": "Induction and Recursion", "qtext": "<p>With <em>F</em><sub>1</sub> = <em>F</em><sub>2</sub> = 1, compute <em>F</em><sub>8</sub>.</p>", "title": "Fibonacci F8", "opts": [{"t": "20", "c": false}, {"t": "13", "c": false}, {"t": "34", "c": false}, {"t": "21", "c": true}]}, {"code": "FB-IND-18", "cat": "Induction and Recursion", "qtext": "<p><em>a</em><sub>1</sub> = 1 and <em>a</em><sub>n</sub> = 2 <em>a</em><sub>n&minus;1</sub>. Find <em>a</em><sub>6</sub>.</p>", "title": "Doubling term", "opts": [{"t": "16", "c": false}, {"t": "32", "c": true}, {"t": "64", "c": false}, {"t": "12", "c": false}]}, {"code": "FB-IND-23", "cat": "Induction and Recursion", "qtext": "<p><em>a</em><sub>1</sub> = 2 and <em>a</em><sub>n</sub> = <em>a</em><sub>n&minus;1</sub> + <em>n</em> for <em>n</em> &ge; 2. Find <em>a</em><sub>4</sub>.</p>", "title": "Recurrence with index", "opts": [{"t": "9", "c": false}, {"t": "14", "c": false}, {"t": "10", "c": false}, {"t": "11", "c": true}]}, {"code": "FB-IND-04", "cat": "Induction and Recursion", "qtext": "<p>A sequence satisfies <em>a</em><sub>0</sub> = 0 and <em>a</em><sub>n</sub> = <em>a</em><sub>n&minus;1</sub> + 2<em>n</em> for <em>n</em> &ge; 1.</p>\n      <p>Its closed form is <em>a</em><sub>n</sub> = ______. (Write it as n^2+n.)</p>", "title": "Closed form", "opts": [{"t": "n^2", "c": false}, {"t": "2n+1", "c": false}, {"t": "2^n", "c": false}, {"t": "n(n+1)", "c": true}]}, {"code": "FB-IND-12", "cat": "Induction and Recursion", "qtext": "<p><em>a</em><sub>0</sub> = 1 and <em>a</em><sub>n</sub> = <em>a</em><sub>n&minus;1</sub> + 2. Give the closed form (write as 2n+1).</p>", "title": "Closed form (arithmetic)", "opts": [{"t": "2^n", "c": false}, {"t": "2n+1", "c": true}, {"t": "n+2", "c": false}, {"t": "2n-1", "c": false}]}, {"code": "FB-IND-03", "cat": "Induction and Recursion", "qtext": "<p>In strong (complete) induction, one assumes that <em>P</em>(1), <em>P</em>(2), &hellip;, <em>P</em>(<em>k</em>) are all true in order to prove <em>P</em>(<em>k</em>+1).</p>", "title": "Strong induction", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-IND-10", "cat": "Induction and Recursion", "qtext": "<p>For all <em>n</em> &ge; 1, 1 + 3 + 5 + &hellip; + (2<em>n</em>&minus;1) = <em>n</em><sup>2</sup>.</p>", "title": "Odd numbers sum", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-IND-16", "cat": "Induction and Recursion", "qtext": "<p>Strong induction and ordinary induction are equivalent in proving power.</p>", "title": "Strong vs ordinary induction", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-IND-22", "cat": "Induction and Recursion", "qtext": "<p>In the inductive step we prove <em>P</em>(<em>k</em>+1) assuming <em>P</em>(<em>k</em>).</p>", "title": "Inductive step", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-CNT-02", "cat": "Counting", "qtext": "<p>How many subsets does the set {a, b, c, d} have?</p>", "title": "Power set size", "opts": [{"t": "4", "c": false}, {"t": "8", "c": false}, {"t": "16", "c": true}, {"t": "24", "c": false}]}, {"code": "FB-CNT-06", "cat": "Counting", "qtext": "<p>From a club of 10 members, in how many ways can a president and a (different) vice-president be chosen, where order matters?</p>", "title": "Officers selection", "opts": [{"t": "20", "c": false}, {"t": "100", "c": false}, {"t": "45", "c": false}, {"t": "90", "c": true}]}, {"code": "FB-CNT-12", "cat": "Counting", "qtext": "<p>How many subsets does a set with 5 elements have?</p>", "title": "Subsets of a 5-set", "opts": [{"t": "120", "c": false}, {"t": "32", "c": true}, {"t": "10", "c": false}, {"t": "25", "c": false}]}, {"code": "FB-CNT-16", "cat": "Counting", "qtext": "<p>For any integer <em>n</em> &ge; 0, the value of C(<em>n</em>, 0) is:</p>", "title": "Value of C(n,0)", "opts": [{"t": "n!", "c": false}, {"t": "1", "c": true}, {"t": "0", "c": false}, {"t": "n", "c": false}]}, {"code": "FB-CNT-01", "cat": "Counting", "qtext": "<p>Compute the number of ordered arrangements P(7, 2) = 7!/(7&minus;2)!.</p>", "title": "Ordered selection", "opts": [{"t": "42", "c": true}, {"t": "14", "c": false}, {"t": "21", "c": false}, {"t": "49", "c": false}]}, {"code": "FB-CNT-03", "cat": "Counting", "qtext": "<p>Compute the binomial coefficient C(8, 3).</p>", "title": "Combination", "opts": [{"t": "112", "c": false}, {"t": "56", "c": true}, {"t": "24", "c": false}, {"t": "336", "c": false}]}, {"code": "FB-CNT-05", "cat": "Counting", "qtext": "<p>How many diagonals does a convex hexagon (6 vertices) have?</p>", "title": "Diagonals of a hexagon", "opts": [{"t": "12", "c": false}, {"t": "9", "c": true}, {"t": "15", "c": false}, {"t": "6", "c": false}]}, {"code": "FB-CNT-07", "cat": "Counting", "qtext": "<p>Compute 6!.</p>", "title": "Factorial", "opts": [{"t": "5040", "c": false}, {"t": "120", "c": false}, {"t": "360", "c": false}, {"t": "720", "c": true}]}, {"code": "FB-CNT-11", "cat": "Counting", "qtext": "<p>How many distinct arrangements of the letters of <strong>MISSISSIPPI</strong> are there? (M:1, I:4, S:4, P:2)</p>", "title": "Arrangements of MISSISSIPPI", "opts": [{"t": "39916800", "c": false}, {"t": "34650", "c": true}, {"t": "17325", "c": false}, {"t": "69300", "c": false}]}, {"code": "FB-CNT-17", "cat": "Counting", "qtext": "<p>How many 4-digit PIN codes are there (each digit 0&ndash;9, repetition allowed)?</p>", "title": "Number of 4-digit PINs", "opts": [{"t": "40", "c": false}, {"t": "10000", "c": true}, {"t": "5040", "c": false}, {"t": "1000", "c": false}]}, {"code": "FB-CNT-19", "cat": "Counting", "qtext": "<p>In how many ways can 7 distinct books be arranged on a shelf?</p>", "title": "Arrange 7 books", "opts": [{"t": "720", "c": false}, {"t": "2520", "c": false}, {"t": "5040", "c": true}, {"t": "49", "c": false}]}, {"code": "FB-CNT-21", "cat": "Counting", "qtext": "<p>Compute C(12, 12).</p>", "title": "C(12,12)", "opts": [{"t": "0", "c": false}, {"t": "144", "c": false}, {"t": "12", "c": false}, {"t": "1", "c": true}]}, {"code": "FB-CNT-23", "cat": "Counting", "qtext": "<p>In how many ways can a committee of 4 be chosen from 10 people?</p>", "title": "Committee of 4 from 10", "opts": [{"t": "90", "c": false}, {"t": "210", "c": true}, {"t": "5040", "c": false}, {"t": "24", "c": false}]}, {"code": "FB-CNT-22", "cat": "Counting", "qtext": "<p>The product <em>n</em> &middot; (<em>n</em>&minus;1) &middot; &hellip; &middot; 2 &middot; 1, written <em>n</em>!, is called the ______ of <em>n</em>. (One word.)</p>", "title": "Name of n!", "opts": [{"t": "permutation", "c": false}, {"t": "power", "c": false}, {"t": "combination", "c": false}, {"t": "factorial", "c": true}]}, {"code": "FB-CNT-04", "cat": "Counting", "qtext": "<p>For all integers 0 &le; <em>k</em> &le; <em>n</em>, the identity C(<em>n</em>, <em>k</em>) = C(<em>n</em>, <em>n</em>&minus;<em>k</em>) holds.</p>", "title": "Symmetry of binomials", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-CNT-10", "cat": "Counting", "qtext": "<p>There are 1024 bit strings of length 10.</p>", "title": "Bit strings length 10", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-CNT-18", "cat": "Counting", "qtext": "<p>The number of permutations of all <em>n</em> objects is P(<em>n</em>, <em>n</em>) = <em>n</em>!.</p>", "title": "P(n,n)", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-GRP-02", "cat": "Graphs", "qtext": "<p>A connected undirected graph with <em>n</em> vertices and exactly <em>n</em> &minus; 1 edges is called a:</p>", "title": "Characterising a tree", "opts": [{"t": "tree", "c": true}, {"t": "complete graph", "c": false}, {"t": "cycle", "c": false}, {"t": "bipartite graph", "c": false}]}, {"code": "FB-GRP-06", "cat": "Graphs", "qtext": "<p>What is the chromatic number of a bipartite graph that contains at least one edge?</p>", "title": "Chromatic number", "opts": [{"t": "2", "c": true}, {"t": "4", "c": false}, {"t": "1", "c": false}, {"t": "3", "c": false}]}, {"code": "FB-GRP-08", "cat": "Graphs", "qtext": "<p>In a graph with 8 edges, the sum of all vertex degrees is:</p>", "title": "Degree sum, 8 edges", "opts": [{"t": "4", "c": false}, {"t": "64", "c": false}, {"t": "16", "c": true}, {"t": "8", "c": false}]}, {"code": "FB-GRP-16", "cat": "Graphs", "qtext": "<p>What is the chromatic number of the complete graph <em>K</em><sub>4</sub>?</p>", "title": "Chromatic number of K4", "opts": [{"t": "2", "c": false}, {"t": "4", "c": true}, {"t": "3", "c": false}, {"t": "1", "c": false}]}, {"code": "FB-GRP-21", "cat": "Graphs", "qtext": "<p>In the cycle graph <em>C</em><sub>n</sub> (<em>n</em> &ge; 3), every vertex has degree:</p>", "title": "Degree in a cycle graph", "opts": [{"t": "3", "c": false}, {"t": "1", "c": false}, {"t": "n", "c": false}, {"t": "2", "c": true}]}, {"code": "FB-GRP-01", "cat": "Graphs", "qtext": "<p>How many edges does the complete graph <em>K</em><sub>5</sub> have?</p>", "title": "Edges of K5", "opts": [{"t": "5", "c": false}, {"t": "25", "c": false}, {"t": "10", "c": true}, {"t": "20", "c": false}]}, {"code": "FB-GRP-05", "cat": "Graphs", "qtext": "<p>A graph has 6 vertices, each of degree 3. How many edges does it have?</p>", "title": "Edges from degree sequence", "opts": [{"t": "9", "c": true}, {"t": "6", "c": false}, {"t": "18", "c": false}, {"t": "12", "c": false}]}, {"code": "FB-GRP-07", "cat": "Graphs", "qtext": "<p>How many edges does the complete graph <em>K</em><sub>7</sub> have?</p>", "title": "Edges of K7", "opts": [{"t": "42", "c": false}, {"t": "49", "c": false}, {"t": "21", "c": true}, {"t": "14", "c": false}]}, {"code": "FB-GRP-10", "cat": "Graphs", "qtext": "<p>How many edges does a tree with 12 vertices have?</p>", "title": "Edges of a tree", "opts": [{"t": "24", "c": false}, {"t": "11", "c": true}, {"t": "12", "c": false}, {"t": "13", "c": false}]}, {"code": "FB-GRP-12", "cat": "Graphs", "qtext": "<p>A graph has 5 vertices, each of degree 4. How many edges does it have?</p>", "title": "Edges from regular degrees", "opts": [{"t": "5", "c": false}, {"t": "10", "c": true}, {"t": "20", "c": false}, {"t": "9", "c": false}]}, {"code": "FB-GRP-17", "cat": "Graphs", "qtext": "<p>What is the maximum number of edges in a simple undirected graph with 8 vertices?</p>", "title": "Max edges, 8 vertices", "opts": [{"t": "56", "c": false}, {"t": "64", "c": false}, {"t": "28", "c": true}, {"t": "16", "c": false}]}, {"code": "FB-GRP-20", "cat": "Graphs", "qtext": "<p>A connected planar graph has 6 vertices and 9 edges. By Euler's formula <em>v</em> &minus; <em>e</em> + <em>f</em> = 2, how many faces <em>f</em> does it have?</p>", "title": "Euler's formula (faces)", "opts": [{"t": "4", "c": false}, {"t": "5", "c": true}, {"t": "7", "c": false}, {"t": "3", "c": false}]}, {"code": "FB-GRP-22", "cat": "Graphs", "qtext": "<p>How many edges does the cycle graph <em>C</em><sub>6</sub> have?</p>", "title": "Edges of C6", "opts": [{"t": "12", "c": false}, {"t": "5", "c": false}, {"t": "7", "c": false}, {"t": "6", "c": true}]}, {"code": "FB-GRP-04", "cat": "Graphs", "qtext": "<p>A path that visits every vertex of a graph exactly once is called a ______ path. (One word.)</p>", "title": "Hamiltonian path", "opts": [{"t": "Eulerian", "c": false}, {"t": "planar", "c": false}, {"t": "Hamiltonian", "c": true}, {"t": "bipartite", "c": false}]}, {"code": "FB-GRP-13", "cat": "Graphs", "qtext": "<p>A closed walk that uses every edge of a graph exactly once and returns to its start is called an Euler ______. (One word.)</p>", "title": "Euler circuit", "opts": [{"t": "Hamiltonian circuit", "c": false}, {"t": "Euler circuit", "c": true}, {"t": "spanning tree", "c": false}, {"t": "bipartite path", "c": false}]}, {"code": "FB-GRP-19", "cat": "Graphs", "qtext": "<p>A graph that can be drawn in the plane with no edges crossing is called a ______ graph. (One word.)</p>", "title": "Planar graph", "opts": [{"t": "planar", "c": true}, {"t": "complete", "c": false}, {"t": "regular", "c": false}, {"t": "bipartite", "c": false}]}, {"code": "FB-GRP-03", "cat": "Graphs", "qtext": "<p>Every complete graph <em>K</em><sub>n</sub> is planar for all <em>n</em>.</p>", "title": "Planarity of complete graphs", "opts": [{"t": "False", "c": true}, {"t": "True", "c": false}]}, {"code": "FB-GRP-09", "cat": "Graphs", "qtext": "<p>In any undirected graph, the number of vertices of odd degree is even.</p>", "title": "Odd-degree vertices", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}, {"code": "FB-GRP-14", "cat": "Graphs", "qtext": "<p>A tree is a connected graph that contains no cycles.</p>", "title": "Definition of a tree", "opts": [{"t": "True", "c": true}, {"t": "False", "c": false}]}];
let idx=0; const answered={}; const picked={};
const card=document.getElementById('card');
let teacher=false;
function render(){
 const q=DATA[idx];
 const c=q.code.split('-')[1];
 let h=`<div class="tags"><span class="cat ${c}">${q.cat}</span>`
  +`<span class="code">${q.code}</span><span class="qpos">Question ${idx+1} / ${DATA.length}</span></div>`;
 h+=`<div class="qtext">${q.qtext}</div><div class="opts">`;
 const L=['A','B','C','D','E'];
 q.opts.forEach((o,j)=>{
  let cls='opt';
  const isAns=answered[idx];
  if(isAns||teacher){ if(o.c)cls+=' right'; if(isAns&&picked[idx]===j&&!o.c)cls+=' wrong'; }
  if(isAns)cls+=' disabled';
  h+=`<button class="${cls}" data-j="${j}" ${isAns?'disabled':''}><span class="ltr">${L[j]}</span><span>${o.t}</span></button>`;
 });
 h+=`</div>`;
 card.innerHTML=h;
 if(!answered[idx]&&!teacher){
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
 }
 document.getElementById('prev').disabled=idx===0;
 document.getElementById('next').disabled=idx===DATA.length-1;
 const done=Object.keys(answered).length;
 document.querySelector('.progress>div').style.width=(100*(idx+1)/DATA.length)+'%';
 const correct=Object.keys(answered).filter(k=>DATA[k].opts[picked[k]].c).length;
 document.getElementById('score').innerHTML=`Score <b>${correct}</b> / ${done}`;
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
}
function pick(j){ if(answered[idx])return; answered[idx]=true; picked[idx]=j; render(); }
function go(d){ idx=Math.min(DATA.length-1,Math.max(0,idx+d)); render(); }
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1);
});
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('tv').onchange=e=>{teacher=e.target.checked;render();};
render();
</script>
</body>
</html>
